<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voc a Bit – Vokabeltrainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voc a Bit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1026" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Nunito:wght@500..900&display=swap">
<style>
/* Layout: one-column phone app (max 560px), sticky top bar, fixed bottom nav; quiz and result take the whole screen.
   Look: chunky and playful. Every control is a solid block with a darker bottom edge that presses down.
   Identity: Königsblau + highlighter gold + Union-Jack red, Bit, a manga kid with blue hair, as coach, the Karteikasten as learning model.
   Motion: only transform/opacity; every keyframe animation sits inside prefers-reduced-motion: no-preference. */
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --surface-2:#EDF0F9; --ink:#1B2250; --ink-2:#515B85; --ink-3:#626B90;
  --line:#E0E5F3; --line-2:#CBD2E9; --edge:#808ABA;           /* edge: outline of inputs and answer cards, 3:1 on the page */
  --royal:#3755EE; --royal-deep:#2538B8; --royal-ink:#FFFFFF; --royal-soft:#E4E9FF;
  --gold:#FFC21A; --gold-deep:#E3A100; --gold-soft:#FFF3CC; --gold-ink:#6B4A00; --gold-text:#8F6100;
  --flame:#FF8A1F; --flame-soft:#FFEBD9; --flame-text:#B34F08;
  --good:#17A865; --good-deep:#0F8650; --good-soft:#DDF6EA; --good-ink:#0B6B41;
  --good-btn:#0F8650; --good-btn-deep:#0A6B3F; --on-good:#FFFFFF;
  --bad:#EC4B50; --bad-deep:#C2343A; --bad-soft:#FFE3E4; --bad-ink:#A3242A;
  --bad-btn:#D8353B; --bad-btn-deep:#AD262B; --on-bad:#FFFFFF;
  --sky:#1B74B8; --on-sky:#FFFFFF;
  --hl:#FFD43B;
  --f0:#CBD2E9; --f1:#FF7F61; --f2:#FFAE3D; --f3:#F5CB2E; --f4:#6FD3A0; --f5:#17A865;
  --f-ui:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode","Arial Unicode MS",system-ui,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px; --nav-h:64px;
  --spring:cubic-bezier(.2,1.3,.4,1); --out:cubic-bezier(.2,.8,.2,1);
  --hue:var(--royal); --hue-deep:var(--royal-deep);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1026; --surface:#141A3A; --surface-2:#1B234C; --ink:#F1F3FF; --ink-2:#B8BFDF; --ink-3:#8E97BE;
  --line:#262F66; --line-2:#333E85; --edge:#5E6CC6;
  --royal:#8799FF; --royal-deep:#5568E6; --royal-ink:#0B1026; --royal-soft:#232D6B;
  --gold:#FFC93C; --gold-deep:#C99400; --gold-soft:#3D3210; --gold-ink:#FFE38A; --gold-text:#FFC93C;
  --flame-soft:#3E2412; --flame-text:#FF8A1F;
  --good:#3DD69B; --good-deep:#1FA772; --good-soft:#0F3A2B; --good-ink:#93ECC8;
  --good-btn:#3DD69B; --good-btn-deep:#1FA772; --on-good:#0B1026;
  --bad:#FF6B70; --bad-deep:#D2454B; --bad-soft:#45181D; --bad-ink:#FFB5B8;
  --bad-btn:#FF6B70; --bad-btn-deep:#D2454B; --on-bad:#0B1026;
  --sky:#4DB8FF; --on-sky:#0B1026;
  --f0:#333E85;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1026; --surface:#141A3A; --surface-2:#1B234C; --ink:#F1F3FF; --ink-2:#B8BFDF; --ink-3:#8E97BE;
  --line:#262F66; --line-2:#333E85; --edge:#5E6CC6;
  --royal:#8799FF; --royal-deep:#5568E6; --royal-ink:#0B1026; --royal-soft:#232D6B;
  --gold:#FFC93C; --gold-deep:#C99400; --gold-soft:#3D3210; --gold-ink:#FFE38A; --gold-text:#FFC93C;
  --flame-soft:#3E2412; --flame-text:#FF8A1F;
  --good:#3DD69B; --good-deep:#1FA772; --good-soft:#0F3A2B; --good-ink:#93ECC8;
  --good-btn:#3DD69B; --good-btn-deep:#1FA772; --on-good:#0B1026;
  --bad:#FF6B70; --bad-deep:#D2454B; --bad-soft:#45181D; --bad-ink:#FFB5B8;
  --bad-btn:#FF6B70; --bad-btn-deep:#D2454B; --on-bad:#0B1026;
  --sky:#4DB8FF; --on-sky:#0B1026;
  --f0:#333E85;
  color-scheme:dark;
}
.hue-royal{--hue:#3755EE;--hue-deep:#2538B8}
.hue-rose{--hue:#D43A40;--hue-deep:#A82B30}
.hue-green{--hue:#0F8650;--hue-deep:#0A6B3F}
.hue-violet{--hue:#7C4DEB;--hue-deep:#5E34C9}
.hue-orange{--hue:#B85900;--hue-deep:#8F4500}
.hue-teal{--hue:#0B7E8B;--hue-deep:#086470}

/* base */
*,*::before,*::after{box-sizing:border-box}
html{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,.selectable{-webkit-user-select:text;user-select:text}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3{font-family:var(--f-ui);font-weight:900;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
ol,ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:3px solid var(--royal);outline-offset:3px;border-radius:10px}
[tabindex="-1"]:focus{outline:none}
.ms{width:1em;height:1em;font-size:24px;display:inline-block;flex:none;vertical-align:middle;overflow:visible}
.art{width:24px;height:24px;display:inline-block;flex:none;vertical-align:middle}
.bit{display:block;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ipa{font-family:var(--f-ipa);color:var(--ink-3);font-size:.9em;font-weight:400}
.lbl{font:800 12px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* top bar + bottom nav */
.top{position:sticky;top:0;z-index:20;background:var(--bg);margin-inline:-16px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
/* The name sits beside the logo only while it fits: otherwise it wraps into a second line, which the fixed height cuts off. */
.brand{flex:1 1 0;min-width:32px;display:flex;flex-wrap:wrap;align-items:center;align-content:flex-start;column-gap:8px;height:44px;overflow:hidden;background:none;border:0;padding:0;font:900 19px/44px var(--f-ui);letter-spacing:-.02em;color:var(--ink);text-align:left}
.brand .logo{margin-block:6px}
.brand span{white-space:nowrap}
.logo{width:32px;height:32px;flex:none}
.chips{display:flex;gap:2px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;min-height:44px;border:0;border-radius:14px;background:none;font:900 16px var(--f-ui);font-variant-numeric:tabular-nums;color:var(--ink-2);transition:transform .1s}
.chip:active{transform:scale(.94)}
.chip .art{width:24px;height:24px}
.chip-flame.on b{color:var(--flame-text)}
.chip-coin b{color:var(--gold-text)}
.chip-xp b{color:var(--royal)}
.main{display:flex;flex-direction:column;gap:16px;padding-block:8px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h);padding-inline:6px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 11px var(--f-ui);letter-spacing:.02em;color:var(--ink-3)}
.nav .nic{display:grid;place-items:center;width:56px;height:34px;border-radius:12px;border:2px solid transparent;transition:transform .12s}
.nav button .ms{font-size:26px}
.nav button:active .nic{transform:scale(.9)}
.nav button[aria-current="page"]{color:var(--royal)}
.nav button[aria-current="page"] .nic{background:var(--royal-soft);border-color:var(--royal)}

/* buttons: solid block + darker bottom edge that presses down */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-md);padding:13px 20px;min-height:52px;
  font:900 16px/1.1 var(--f-ui);letter-spacing:.04em;text-transform:uppercase;position:relative;transition:transform .07s,box-shadow .07s,background-color .15s}
.btn .ms{font-size:22px}
.btn .art{width:22px;height:22px}
.btn.wide{width:100%}
.btn-primary{background:var(--royal);color:var(--royal-ink);box-shadow:0 5px 0 var(--royal-deep)}
.btn-good{background:var(--good-btn);color:var(--on-good);box-shadow:0 5px 0 var(--good-btn-deep)}
.btn-bad{background:var(--bad-btn);color:var(--on-bad);box-shadow:0 5px 0 var(--bad-btn-deep)}
.btn-gold{background:var(--gold);color:#4A3300;box-shadow:0 5px 0 var(--gold-deep)}
.btn-white{background:#fff;color:var(--hue-deep);box-shadow:0 5px 0 rgba(0,0,0,.22)}
.btn-line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line-2),0 4px 0 var(--line-2)}
.btn-soft{background:var(--royal-soft);color:var(--royal);box-shadow:0 4px 0 var(--line-2)}
.btn-danger{background:var(--bad-soft);color:var(--bad-ink);box-shadow:0 4px 0 var(--line-2)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 transparent}
.btn-line:active{box-shadow:inset 0 0 0 2px var(--line-2)}
.btn[disabled]{opacity:.5;cursor:default}
.btn[disabled]:active{transform:none}
.btn-xl{min-height:60px;font-size:18px;border-radius:18px}
.btn-sm{min-height:44px;padding:8px 14px;font-size:13px;border-radius:13px}
.link{background:none;border:0;color:var(--royal);font:800 14px var(--f-ui);padding:10px;min-height:44px}
.link.onhue{color:#fff}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;display:grid;place-items:center;background:var(--royal-soft);color:var(--royal);flex:none;transition:transform .1s}
.iconbtn:active{transform:scale(.9)}
.iconbtn.sm{width:40px;height:40px}
.iconbtn.sm .ms{font-size:20px}
.iconbtn.plain{background:transparent;color:var(--ink-2)}

/* cards and small parts */
.card{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r-lg);padding:16px}
.card h3{font-size:18px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font:800 13px var(--f-ui);background:var(--surface-2);color:var(--ink-2)}
.pill .ms{font-size:16px}
.pill-gold{background:var(--gold-soft);color:var(--gold-ink)}
.notice{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-md);background:var(--gold-soft);color:var(--gold-ink);font-size:15px;line-height:1.35}
.notice .ms{font-size:24px}
.notice .art{width:30px;height:30px}
.notice.good{background:var(--good-soft);color:var(--good-ink)}
.notice.blue{background:var(--royal-soft);color:var(--ink)}
.err{color:var(--bad-ink);background:var(--bad-soft);padding:10px 14px;border-radius:12px;font-size:15px}
.bar{display:block;height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.bar > span{display:block;height:100%;border-radius:999px;background:var(--royal);position:relative;transition:width .7s var(--out);min-width:0}
.bar > span::after{content:"";position:absolute;left:7px;right:7px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.bar.gold > span{background:var(--gold)}
.bar.green > span{background:var(--good)}
.bar.thin{height:8px}
.bar.thin > span::after{display:none}
.bar.onhue{background:rgba(255,255,255,.28)}
.bar.onhue > span{background:#fff}
.bar.onhue > span::after{display:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.sec-h h2{font-size:22px}
.sub-h{display:flex;align-items:center;gap:8px;padding-top:4px}
.sub-h h2{font-size:22px;flex:1}
.empty{text-align:center;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .bit{width:96px;height:96px}
.empty p{color:var(--ink-2)}
.skel{height:84px;border-radius:var(--r-lg);background:var(--surface);border:2px solid var(--line)}
.seg{display:flex;background:var(--surface-2);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:8px 6px;font-weight:800;color:var(--ink-2);min-height:48px;line-height:1.2;transition:transform .1s}
.seg button:active{transform:scale(.96)}
.seg button small{display:block;font-weight:700;font-size:12px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--royal);box-shadow:0 2px 0 var(--line-2),0 0 0 2px var(--line)}
.field{width:100%;height:50px;border-radius:14px;border:2px solid var(--edge);background:var(--surface);padding:0 14px;font-size:16px;font-weight:700}
.field:focus{border-color:var(--royal);outline:none}
.area{width:100%;border-radius:14px;border:2px solid var(--edge);background:var(--surface);padding:12px 14px;font:600 16px/1.5 var(--f-ui);resize:vertical;min-height:120px}
.area[readonly]{font-size:13px;color:var(--ink-2)}
.switch{width:54px;height:32px;border-radius:999px;border:0;background:var(--edge);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .18s var(--spring)}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.setting{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting b{display:block}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px 14px;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;top:26px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 4px}

/* home: hero */
.hero{display:flex;flex-direction:column;gap:12px}
.hero-top{display:flex;align-items:flex-start;gap:14px}
.hero-bit{width:104px;height:104px;margin:-6px -4px 0 -6px}
.hero .bubble{flex:1;display:flex;flex-direction:column;gap:2px}
.hero .bubble b{font:900 22px/1.15 var(--f-ui)}
.hero .bubble span{font-size:15px;color:var(--ink-2);line-height:1.35}
.hero-sub{text-align:center;font:800 13px var(--f-ui);color:var(--ink-3);margin-top:-2px}
.update{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--good-soft);color:var(--good-ink);border:0;width:100%;text-align:left;font-weight:800}
.update .ms{font-size:26px}
/* home: today */
.today{display:flex;flex-direction:column;gap:14px}
.meter-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.meter-h b{font-weight:900;font-size:15px}
.meter-h span{font:800 13px var(--f-ui);color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter-row{display:flex;align-items:center;gap:10px}
.meter-row .bar{flex:1}
.meter-end{width:32px;height:32px}
.lvl-next{width:32px;height:32px;border-radius:11px;background:var(--royal-soft);color:var(--royal);display:grid;place-items:center;font:900 14px var(--f-ui);flex:none}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding-top:12px;border-top:2px dashed var(--line)}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font:800 11px var(--f-ui);color:var(--ink-3)}
.day i{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-style:normal}
.day i .art{width:22px;height:22px}
.day.on i{background:var(--flame-soft)}
.day.ice i{background:var(--royal-soft)}
.day.today span{color:var(--ink)}
.day.today i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--royal)}
/* home: quests */
.quests{display:flex;flex-direction:column;gap:4px;padding-bottom:10px}
.quests-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.quests-h h3{flex:1}
.quests-h .pill{font-variant-numeric:tabular-nums}
.quest{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:2px solid var(--line);padding:11px 0;min-height:56px;color:var(--ink);transition:transform .1s}
.quest:first-of-type{border-top:0}
.quest:not([disabled]):active{transform:scale(.98)}
.quest-ic{width:34px;height:34px}
.quest .grow{display:block}
.quest b{display:block;font-weight:800;font-size:15px;line-height:1.25;margin-bottom:6px}
.quest .bar > span{background:var(--gold)}
.quest-r{display:flex;flex-direction:column;align-items:center;gap:0;min-width:46px;font:900 12px var(--f-ui);color:var(--ink-3);font-variant-numeric:tabular-nums}
.quest-r .art{width:28px;height:28px}
.quest-r em{font-style:normal;display:inline-flex;align-items:center;gap:3px;color:var(--gold-text)}
.quest-r em .art{width:15px;height:15px}
.quest.done b{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:2px}
.quest.done .bar > span{background:var(--good)}
.quest-chest{display:flex;align-items:center;gap:10px;border-top:2px solid var(--line);padding-top:10px;font:800 13px var(--f-ui);color:var(--ink-2)}
.quest-chest .art{width:34px;height:34px}
.quest-chest.open{color:var(--good-ink)}
/* home: review + targets */
.review{display:flex;align-items:center;gap:12px}
.review .art{width:40px;height:40px}
.review h3{font-size:17px}
.review p{font-size:14px;color:var(--ink-2);line-height:1.3}
.target h3{font-size:18px;display:flex;align-items:center;gap:6px}
.target h3 .ms{color:var(--royal)}
.target p{font-size:15px;color:var(--ink-2);margin:6px 0 10px;line-height:1.35}
.target.behind{border-color:var(--gold-deep)}
.target.behind .bar > span{background:var(--gold)}
.target.last,.target.late{border-color:var(--bad)}
.target.last .bar > span,.target.late .bar > span{background:var(--bad)}
.target.done{border-color:var(--good)}
.target.done .bar > span{background:var(--good)}
.target.done h3 .ms{color:var(--good)}
.target-form h3{font-size:18px}
/* home: learning path */
.unit-path{display:flex;flex-direction:column;gap:6px}
.unit-h{display:flex;align-items:center;gap:12px;background:var(--hue);color:#fff;border-radius:var(--r-lg);padding:14px 14px 14px 16px;box-shadow:0 5px 0 var(--hue-deep);margin-bottom:8px}
.unit-h small{display:block;font:800 12px var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.unit-h b{display:block;font:900 19px/1.2 var(--f-ui);margin:2px 0 8px;overflow-wrap:anywhere}
.unit-prog{display:flex;align-items:center;gap:10px}
.unit-prog .bar{flex:1;height:10px}
.unit-prog i{font:900 13px var(--f-ui);font-style:normal;font-variant-numeric:tabular-nums}
.unit-btn{width:48px;height:48px;border-radius:15px;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;flex:none;transition:transform .1s}
.unit-btn:active{transform:scale(.92)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 18px}
.node-li{width:100%;display:flex;flex-direction:column;align-items:center}
.node-wrap{position:relative;transform:translateX(var(--x,0px))}
.node{position:relative;width:84px;height:88px;border:0;background:none;padding:0;display:grid;place-items:start center}
.node-ring{position:absolute;left:0;top:0;width:84px;height:84px;transform:rotate(-90deg)}
.node-ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.node-ring .trk{stroke:var(--line)}
.node-ring .val{stroke:var(--hue);transition:stroke-dashoffset .8s var(--out)}
.node-btn{position:absolute;left:13px;top:11px;width:58px;height:54px;border-radius:50%;background:var(--hue);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--hue-deep);transition:transform .07s,box-shadow .07s}
.node-btn .ms{font-size:28px}
.node.gold .node-btn .ms{font-size:32px;--sw:3.4;color:#5A3F00}
.node-btn .art{width:30px;height:30px}
.node:active .node-btn{transform:translateY(5px);box-shadow:0 1px 0 var(--hue-deep)}
.node.new .node-btn{background:var(--surface-2);color:var(--ink-3);box-shadow:0 6px 0 var(--line-2)}
.node.new:active .node-btn{box-shadow:0 1px 0 var(--line-2)}
.node.gold .node-btn,.node.legend .node-btn{background:var(--gold);box-shadow:0 6px 0 var(--gold-deep)}
.node.gold:active .node-btn,.node.legend:active .node-btn{box-shadow:0 1px 0 var(--gold-deep)}
.node.gold .node-ring .val,.node.legend .node-ring .val{stroke:var(--gold)}
.node.legend .node-btn{background:linear-gradient(140deg,#FFE27A,#FFB300)}
.node-due{position:absolute;right:2px;top:0;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--bad-btn);color:var(--on-bad);font:900 12px/24px var(--f-ui);text-align:center;box-shadow:0 0 0 3px var(--bg)}
.node-flag{position:absolute;left:50%;bottom:calc(100% + 2px);translate:-50% 0;background:var(--surface);color:var(--ink);border:2px solid var(--line-2);border-bottom-width:4px;border-radius:12px;padding:6px 12px;font:900 13px var(--f-ui);letter-spacing:.06em;white-space:nowrap;z-index:2;pointer-events:none}
.node-flag::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line-2);border-bottom:4px solid var(--line-2);transform:translateX(-50%) rotate(45deg);border-radius:0 0 3px 0}
.node-li.has-flag{padding-top:34px}
.node-pop{position:relative;width:100%;margin-top:10px;background:var(--hue);color:#fff;border-radius:18px;padding:14px 16px 6px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--hue-deep)}
.node-pop::before{content:"";position:absolute;top:-8px;left:calc(50% + var(--x,0px));width:18px;height:18px;background:var(--hue);transform:translateX(-50%) rotate(45deg);border-radius:4px 0 0 0}
.node-pop b{font:900 18px/1.2 var(--f-ui)}
.node-pop .small{line-height:1.3}
.node-pop .btn{margin-top:6px}
.dots{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0}
.dots i{width:12px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}

/* practice */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;min-width:0;color:var(--ink);transition:transform .07s}
.mode:active{transform:translateY(2px)}
.mode .ms{font-size:24px;color:var(--royal)}
.mode b{font:800 15px/1.2 var(--f-ui)}
.mode small{color:var(--ink-3);font-size:12px;font-weight:700}
.mode[aria-pressed="true"]{border-color:var(--royal);background:var(--royal-soft)}
.mode[aria-pressed="true"] small{color:var(--ink-2)}
.mode.none{border-style:dashed;opacity:.7}
.chipbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;-webkit-overflow-scrolling:touch}
.chipbar::-webkit-scrollbar{display:none}
.fchip{flex:none;border:2px solid var(--line-2);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:7px 14px;font:800 14px var(--f-ui);color:var(--ink-2);white-space:nowrap;min-height:44px;transition:transform .07s}
.fchip:active{transform:translateY(2px)}
.fchip[aria-pressed="true"]{background:var(--royal-soft);border-color:var(--royal);color:var(--royal)}
.fchip .ms{width:16px;height:16px;vertical-align:-3px;margin-right:4px;--sw:3}
.wlist{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r-lg);overflow:hidden}
.ghead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface-2);border-top:2px solid var(--line);position:relative;cursor:pointer;min-height:50px}
.ghead:first-child{border-top:0}
.ghead .lbl{flex:1;color:var(--ink-2)}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:2px solid var(--line);cursor:pointer;position:relative;min-height:56px}
.wrow input,.ghead input{position:absolute;opacity:0;width:1px;height:1px}
.cbox{width:28px;height:28px;border-radius:9px;border:2px solid var(--edge);display:grid;place-items:center;flex:none;color:transparent;background:var(--surface);transition:background .12s,transform .15s var(--spring)}
.cbox .ms{font-size:18px;--sw:3.2}
input:checked + .cbox{background:var(--royal);border-color:var(--royal);color:var(--royal-ink);transform:scale(1.06)}
input:focus-visible + .cbox{outline:3px solid var(--royal);outline-offset:2px}
.wtxt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.wtxt b{font-weight:800;overflow-wrap:anywhere}
.wtxt span{font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:6px;height:16px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.startbar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:10;display:flex;flex-direction:column;gap:10px;margin-inline:-16px;padding:22px 16px 12px;background:linear-gradient(to top,var(--bg) 72%,transparent)}
.startbar .btn{width:100%}
.opt-mark{font-size:12px;color:var(--ink-3);margin-left:4px}

/* vocab */
.search{position:relative}
.search input{width:100%;height:52px;border-radius:var(--r-md);border:2px solid var(--edge);background:var(--surface);padding:0 16px 0 46px;font-size:16px;font-weight:700}
.search input:focus{border-color:var(--royal);outline:none}
.search .ms{position:absolute;left:14px;top:14px;color:var(--ink-3)}
.kasten{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end;height:140px;margin-top:8px}
.fach{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.fach .pile{width:100%;border-radius:10px 10px 6px 6px;min-height:26px;display:flex;align-items:flex-start;justify-content:center;padding-top:3px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.fach .pile b{font:900 15px var(--f-ui);color:#1A1F3A;font-variant-numeric:tabular-nums}
.fach:first-child .pile b{color:var(--ink)}
.fach small{font:800 11px var(--f-ui);color:var(--ink-3);white-space:nowrap}
.import-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-lg);border:2px dashed var(--royal);background:var(--royal-soft);color:var(--ink);transition:transform .1s}
.import-card:active{transform:scale(.98)}
.import-card .ic{width:48px;height:48px;border-radius:15px;background:var(--royal);color:var(--royal-ink);display:grid;place-items:center;flex:none}
.import-card b{font:900 17px var(--f-ui);display:block}
.import-card small{color:var(--ink-2);font-size:13px}
details.unit{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r-lg);overflow:hidden}
details.unit summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:60px}
details.unit summary::-webkit-details-marker{display:none}
details.unit summary .ms{transition:transform .2s;color:var(--ink-3)}
details.unit[open] summary .ms.chev{transform:rotate(180deg)}
details.unit summary b{font:900 17px var(--f-ui);display:block}
details.unit summary small{color:var(--ink-3);font-size:13px}
.vrow{display:flex;gap:12px;padding:12px 16px;border-top:2px solid var(--line);align-items:flex-start}
.vrow .grow b{font-weight:800}
.vrow .de{color:var(--ink-2);font-size:15px}
.vrow .ex{font-size:14px;color:var(--ink-3);font-style:italic;margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:7px;background:var(--surface-2);color:var(--ink-2)}
.unit-foot{padding:12px 16px;border-top:2px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* awards + profile + shop */
.profile{display:flex;align-items:center;gap:14px}
.profile .bit{width:96px;height:96px}
.profile h2{font-size:24px}
.profile .lvl-pill{display:inline-flex;align-items:center;gap:6px;margin:4px 0 8px;padding:4px 10px;border-radius:999px;background:var(--royal-soft);color:var(--royal);font:900 13px var(--f-ui)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.duo .btn{font-size:14px;letter-spacing:.02em;padding-inline:8px;min-width:0}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r-md);padding:12px 14px;display:flex;align-items:center;gap:10px;min-width:0}
.tile .art{width:30px;height:30px}
.tile b{display:block;font:900 22px/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.tile small{color:var(--ink-3);font:800 12px var(--f-ui);display:block}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;min-width:0;text-align:center;color:var(--ink);transition:transform .07s}
.bdg:active{transform:translateY(2px)}
.bdg b{font:800 12px/1.2 var(--f-ui);display:block;overflow-wrap:anywhere;hyphens:auto}
.bdg .bar{width:80%}
.bdg.locked b{color:var(--ink-3)}
.medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:#B5733C;box-shadow:inset 0 0 0 4px rgba(255,255,255,.3),0 4px 0 #8A5528}
.medal .ms{font-size:28px}
.medal.t2{background:#7482A8;box-shadow:inset 0 0 0 4px rgba(255,255,255,.3),0 4px 0 #5A678C}
.medal.t3{background:var(--gold);color:#5A3F00;box-shadow:inset 0 0 0 4px rgba(255,255,255,.45),0 4px 0 var(--gold-deep)}
.medal.off{background:var(--surface-2);color:var(--ink-3);box-shadow:inset 0 0 0 2px var(--line-2),0 4px 0 var(--line-2)}
.medal.big{width:96px;height:96px}
.medal.big .ms{font-size:50px}
.shop-h{display:flex;align-items:center;gap:8px}
.wallet{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);font:900 16px var(--f-ui);font-variant-numeric:tabular-nums}
.shop-item{display:flex;align-items:center;gap:14px}
.shop-item .art{width:52px;height:52px}
.shop-item p{font-size:14px;color:var(--ink-2);line-height:1.3;margin-top:2px}
.outfits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.outfit{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px 12px;text-align:center}
.outfit .bit{width:104px;height:104px}
.outfit b{font-weight:900;font-size:17px;margin-top:-2px}
.outfit.on{border-color:var(--good)}
.outfit .btn{padding-inline:6px;letter-spacing:.02em}
.rar{font:900 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.rar-1{background:var(--sky);color:var(--on-sky)}
.rar-2{background:#7C4DEB;color:#fff}
.rar-3{background:var(--gold);color:#4A3300}
.price{display:inline-flex;align-items:center;gap:5px}
.price .art{width:18px;height:18px}

/* quiz */
.quiz{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.quiz.answered{padding-bottom:330px}
.qtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px;z-index:5}
.xbtn{width:44px;height:44px;border:0;background:none;color:var(--ink-3);display:grid;place-items:center;flex:none;margin-left:-8px;border-radius:12px}
.xbtn .ms{font-size:28px;--sw:2.6}
.qbar{flex:1;height:18px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.qbar span{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .45s var(--spring);position:relative}
.qbar span::after{content:"";position:absolute;left:9px;right:9px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.4)}
.qbar.hot span{background:linear-gradient(90deg,var(--gold),var(--flame))}
.combo{display:inline-flex;align-items:center;gap:2px;font:900 17px var(--f-ui);color:var(--ink-3);min-width:46px;justify-content:flex-end;font-variant-numeric:tabular-nums}
.combo .art{width:24px;height:24px}
.combo.on{color:var(--flame-text)}
.qbody{display:flex;flex-direction:column;gap:14px;flex:1}
.qlabel{font:900 21px/1.2 var(--f-ui)}
.qask{display:flex;align-items:flex-start;gap:12px}
.qbit{width:76px;height:76px;flex:none;margin-top:2px}
.qask .bubble{flex:1;display:flex;flex-direction:column;gap:6px;min-height:64px;justify-content:center}
.qprompt{font:900 26px/1.15 var(--f-ui);overflow-wrap:anywhere}
.qprompt.long{font-size:20px}
.qprompt.sentence{font:700 19px/1.45 var(--f-ui)}
.qsay{display:flex;align-items:center;gap:10px}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--royal);color:var(--royal);font-weight:900;text-align:center;padding:0 .2em}
.blank.ok{color:var(--good-ink);border-color:var(--good)}
.hint{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);line-height:1.3}
.hint .ms{font-size:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);color:var(--ink);border:2px solid var(--edge);border-bottom-width:5px;border-radius:var(--r-md);
  font:800 18px/1.3 var(--f-ui);min-height:60px;transition:transform .06s,background-color .12s,border-color .12s}
.opt:not([disabled]):active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.opt .key{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line-2);display:grid;place-items:center;font:800 13px var(--f-ui);color:var(--ink-3)}
.opt span.t{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .art{width:26px;height:26px}
.opt.is-right{background:var(--good-soft);border-color:var(--good);color:var(--good-ink)}
.opt.is-right .key{border-color:var(--good);background:var(--good);color:var(--on-good)}
.opt.is-wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-ink)}
.opt.is-wrong .key{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.is-dim{opacity:.5}
.opt[disabled]{cursor:default}
@media (hover:none){.opt .key{display:none}}
.typebox{display:flex;flex-direction:column;gap:12px}
.typebox input{height:62px;border-radius:var(--r-md);border:2px solid var(--edge);border-bottom-width:5px;background:var(--surface);padding:0 18px;font:800 22px var(--f-ui)}
.typebox input:focus{border-color:var(--royal);outline:none}
.typebox input.ok{border-color:var(--good);background:var(--good-soft);color:var(--good-ink)}
.typebox input.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.ok{background:var(--good-soft);color:var(--good-ink)}
.sheet.no{background:var(--bad-soft);color:var(--bad-ink)}
.sheet-in{max-width:560px;margin:0 auto;padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head .art{width:36px;height:36px}
.sheet-head strong{font:900 22px/1.15 var(--f-ui);flex:1}
.gain{display:inline-flex;align-items:center;gap:4px;font:900 15px var(--f-ui);background:var(--gold);color:#4A3300;padding:5px 11px;border-radius:999px;white-space:nowrap}
.gain .art{width:16px;height:16px}
.sheet .wcard{background:var(--surface);color:var(--ink);border-radius:var(--r-md);padding:10px 12px;display:flex;gap:10px;align-items:center}
.sheet .wcard .grow b{font-weight:900}
.sheet .wcard .de{font-size:14px;color:var(--ink-2);line-height:1.3}
.sheet .wcard .ex{font-size:14px;color:var(--ink-3);font-style:italic;margin-top:2px;line-height:1.3}

/* result */
.result{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.res-body{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center}
.res-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.res-bit{width:132px;height:132px}
.result h1{font-size:38px}
.res-hero p{color:var(--ink-2);font-weight:800}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border-radius:var(--r-md);padding:3px 3px 5px;background:var(--royal);text-align:center;color:var(--royal-ink);--c:var(--royal)}
.stat.gold{background:var(--gold);color:#4A3300;--c:var(--gold-text)}
.stat.green{background:var(--good-btn);color:var(--on-good);--c:var(--good-ink)}
.stat.blue{background:var(--sky);color:var(--on-sky);--c:var(--sky)}
.stat span{display:block;font:900 11px/22px var(--f-ui);letter-spacing:.08em;text-transform:uppercase}
.stat b{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--surface);color:var(--c);border-radius:13px;padding:14px 4px;font:900 22px var(--f-ui);font-variant-numeric:tabular-nums}
.stat b .art{width:22px;height:22px}
.xtras{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.xtras span{display:inline-flex;gap:5px;padding:5px 11px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font:800 13px var(--f-ui);color:var(--ink-2)}
.xtras b{color:var(--gold-text)}
.xtras .coin{display:inline-flex;align-items:center;gap:4px;background:var(--gold-soft);border-color:transparent;color:var(--gold-ink)}
.xtras .coin .art{width:16px;height:16px}
.big-art{width:150px;height:150px;position:relative;display:grid;place-items:center;margin:0 auto}
.big-art .art{width:150px;height:150px}
.lvl-badge{width:140px;height:140px;margin:0 auto;border-radius:38px;background:var(--royal);color:#fff;display:grid;place-content:center;text-align:center;box-shadow:0 9px 0 var(--royal-deep);rotate:-4deg}
.lvl-badge small{font:900 14px var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
.lvl-badge b{font:900 64px/1 var(--f-ui)}
.res-foot{display:flex;flex-direction:column;gap:12px}
.res-dots{display:flex;justify-content:center;gap:6px}
.res-dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.res-dots i.on{background:var(--royal);width:20px;border-radius:4px}
.mist{display:flex;flex-direction:column}
.mist div{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:2px solid var(--line);font-size:15px;line-height:1.3}
.mist div:first-child{border-top:0}
.newmedals{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.newmedal{display:flex;flex-direction:column;align-items:center;gap:8px;width:132px;text-align:center}
.newmedal b{font-weight:900;line-height:1.2}
.newmedal small{font-size:13px;color:var(--ink-2);line-height:1.3}

/* import */
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 16px;border:2.5px dashed var(--royal);border-radius:var(--r-lg);background:var(--royal-soft);text-align:center;cursor:pointer}
.drop .ms{font-size:40px;color:var(--royal)}
.drop b{font:900 18px var(--f-ui)}
.drop small{color:var(--ink-2)}
.irow{display:flex;gap:12px;padding:12px 16px;border-top:2px solid var(--line);align-items:flex-start;position:relative}
.irow.off .grow{opacity:.55}
.irow .edit{display:grid;gap:8px;margin-top:8px}
.irow .edit input{height:44px;border-radius:12px;border:2px solid var(--edge);background:var(--surface);padding:0 12px;font-size:16px;width:100%}

/* overlays */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(8,11,30,.6);display:grid;place-items:center;padding:16px}
.overlay.bottom{place-items:end center;padding:0}
.dialog{width:100%;max-width:420px;background:var(--surface);border-radius:26px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;text-align:center}
.dialog h2{font-size:26px}
.dialog .bit{width:112px;height:112px;margin:0 auto}
.dialog .lbl{text-align:left}
.dialog ul{text-align:left;display:flex;flex-direction:column;gap:10px}
.dialog li{display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.3}
.dialog li .art{width:30px;height:30px}
.bsheet{width:100%;max-width:560px;background:var(--surface);border-radius:26px 26px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.bsheet h2{font-size:24px}
.bsheet p{color:var(--ink-2);line-height:1.4}
.bsheet .bar{width:100%}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px) scale(.96);z-index:70;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:16px;font-weight:800;font-size:15px;line-height:1.3;
  max-width:calc(100vw - 32px);width:max-content;opacity:0;pointer-events:none;transition:opacity .2s,transform .28s var(--spring);display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast .ms{flex:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}

/* motion: everything that moves on its own */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes slide-in{from{opacity:0;transform:translateX(34px)}}
@keyframes sheet-up{from{transform:translateY(100%)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes tada{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes fade-in{from{opacity:0}}
@keyframes fade-out{to{opacity:0}}
@keyframes vt-in-right{from{opacity:0;transform:translateX(28px)}}
@keyframes vt-out-left{to{opacity:0;transform:translateX(-28px)}}
@keyframes vt-in-up{from{opacity:0;transform:translateY(36px)}}
@keyframes vt-out-down{to{opacity:0;transform:translateY(24px)}}
@media (prefers-reduced-motion: no-preference){
  .main.enter > *{animation:rise .38s var(--out) both}
  .main.enter > :nth-child(2){animation-delay:.04s}
  .main.enter > :nth-child(3){animation-delay:.08s}
  .main.enter > :nth-child(4){animation-delay:.12s}
  .main.enter > :nth-child(n+5){animation-delay:.16s}
  .node-flag{animation:bob 1.6s ease-in-out 3}      /* three bobs, under five seconds: nothing on the page moves endlessly */
  .node-pop{animation:pop .3s var(--out) both;transform-origin:calc(50% + var(--x,0px)) 0}
  .hero-bit.wave{animation:wiggle .9s ease-in-out 2}
  .qbody.enter{animation:slide-in .28s var(--out) both}
  .sheet.in{animation:sheet-up .32s var(--out) both}
  .sheet.in .sheet-head .art{animation:pop .45s var(--out) .08s both}
  .sheet.in .gain{animation:pop .45s var(--out) .18s both}
  .opt.is-right.fx{animation:pulse .4s var(--out)}
  .opt.is-wrong.fx{animation:shake .38s}
  .typebox input.no.fx{animation:shake .38s}
  .qbit.fx{animation:pop .4s var(--out)}
  .combo.fx{animation:pulse .5s var(--out)}
  .result.enter .res-bit,.result.enter .big-art,.result.enter .lvl-badge{animation:tada .6s var(--out) both}
  .result.enter h1{animation:rise .4s var(--out) .15s both}
  .result.enter .res-hero p,.result.enter .res-sub{animation:rise .4s var(--out) .22s both}
  .result.enter .stat{animation:pop .45s var(--out) both}
  .result.enter .stat:nth-child(1){animation-delay:.3s}
  .result.enter .stat:nth-child(2){animation-delay:.42s}
  .result.enter .stat:nth-child(3){animation-delay:.54s}
  .result.enter .xtras span{animation:pop .4s var(--out) both;animation-delay:calc(.66s + var(--i,0) * .07s)}
  .result.enter .late{animation:rise .4s var(--out) .8s both}
  .result.enter .newmedal{animation:tada .6s var(--out) both;animation-delay:calc(.15s + var(--i,0) * .16s)}
  .result.enter .quest{animation:rise .4s var(--out) both;animation-delay:calc(.1s + var(--i,0) * .12s)}
  .result.enter .quest-chest .art{animation:tada .6s var(--out) .55s both}
  .overlay{animation:fade-in .2s both}
  .dialog{animation:pop .32s var(--out) both}
  .bsheet{animation:sheet-up .3s var(--out) both}
  .outfit.on .bit.fx,.bought{animation:pop .4s var(--out)}
  .skel{animation:fade-in 1.2s ease-in-out infinite alternate}
  /* view transitions between screens (Safari 18+); older systems switch at once */
  ::view-transition-old(root){animation:fade-out .12s ease-out both}
  ::view-transition-new(root){animation:fade-in .2s ease-out both}
  html[data-vt="push"]::view-transition-old(root){animation:vt-out-left .16s ease-in both}
  html[data-vt="push"]::view-transition-new(root){animation:vt-in-right .26s var(--out) both}
  html[data-vt="up"]::view-transition-old(root){animation:fade-out .14s ease-out both}
  html[data-vt="up"]::view-transition-new(root){animation:vt-in-up .3s var(--out) both}
  html[data-vt="down"]::view-transition-old(root){animation:vt-out-down .16s ease-in both}
  html[data-vt="down"]::view-transition-new(root){animation:fade-in .22s ease-out both}
}
@media (prefers-reduced-motion: reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important}
  .bar > span,.qbar span,.node-ring .val{transition:none}
}
@media (min-width:600px){.qprompt{font-size:32px}.qprompt.long{font-size:24px}}
@media (max-width:359px){.brand span{display:none}.badges{gap:8px}.hero-bit{width:84px;height:84px;margin:-4px 0 0 -4px}.duo .btn{font-size:12px;letter-spacing:0;gap:5px;padding-inline:4px}.outfit .btn .ms{display:none}.outfit .bit{width:92px;height:92px}}
</style>

function confetti() {

  const t0 = performance.now();

}

/* ---------- typed answers ---------- */
/* The typed text and the expected word are both reduced to a plain form before they are compared: lower case,

  if (ones) t = t.replace(/\b(your|my|his|her|their|our)\b/g, "one's");
  return t.replace(/[.,!?;:"“”„()\[\]]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^to /, '').trim();
}
const plainAns = s => String(s).toLowerCase().replace(/[’`´]/g, "'").replace(/[.,!?;:"“”„()\[\]]/g, ' ').replace(/\s+/g, ' ').trim();

  for (const alt of base.split(/\s\/\s/)) { out.add(normAns(alt.replace(/\([^)]*\)/g, ' '), ones)); out.add(normAns(alt.replace(/[()]/g, ' '), ones)) }

  p.mastered = p.mastered || {};

  if (quit && !(levelUp || fresh.length || mastered.length || targetsDone.length || quests.done.length || quests.chest)) {

/* ---------- today's counters, coins, daily quests ---------- */
/* dayStats() holds what happened today; it starts fresh at midnight. Quests read their progress from it,
   so they need no bookkeeping of their own. */
function dayStats() {
  const p = S.prog, k = todayKey();
  if (!p.today || p.today.day !== k) p.today = { day: k, right: 0, rounds: 0, perfect: 0, typed: 0, past: 0, up: 0, fresh: 0, combo: 0 };
  return p.today;
}
function addCoins(n) { if (!n) return; S.prog.coins = (S.prog.coins || 0) + n; S.prog.coinsEarned = (S.prog.coinsEarned || 0) + n }
/* The daily goal counts once per calendar day and pays 10 coins. Checked after rounds, at start and when the goal
   is changed, so a closed app or a new goal loses nothing and nothing counts twice. */
function payGoal() { const p = S.prog, k = todayKey(); if (p.goalDay === k || xpToday() < p.goal) return false; p.goalDay = k; p.goalDays = (p.goalDays || 0) + 1; addCoins(10); return true }
function seedRand(str) {
  let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000 };
}
const QUESTS = {
  xp:      { ic: 'bolt',   t: n => `Sammle ${n} XP`, steps: [40, 60, 80], cur: () => xpToday() },
  rounds:  { ic: 'target', t: n => `Schaffe ${n} Runden`, steps: [2, 3], cur: d => d.rounds },
  right:   { ic: 'heart',  t: n => `${n} richtige Antworten`, steps: [20, 30, 40], cur: d => d.right },
  combo:   { ic: 'flame',  t: n => `${n} richtige in Folge`, steps: [5, 8, 10], cur: d => d.combo },   // a combo lives inside one round, so never more than the shortest round has questions
  perfect: { ic: 'star',   t: n => n === 1 ? 'Eine Runde ohne Fehler' : `${n} Runden ohne Fehler`, steps: [1, 2], cur: d => d.perfect },
  up:      { ic: 'crown',  t: n => `Bring ${n} Wörter ein Fach höher`, steps: [6, 10], cur: d => d.up, ok: () => S.words.filter(w => !fach(w.id) || isDue(w.id)).length >= 12 },
  fresh:   { ic: 'book',   t: n => `Lerne ${n} neue Wörter`, steps: [5, 8], cur: d => d.fresh, ok: () => S.words.filter(w => !(ws(w.id) && ws(w.id).r)).length >= 8 },
  typed:   { ic: 'pencil', t: n => `Schreibe ${n} Wörter richtig`, steps: [5, 8], cur: d => d.typed, mode: 'type' },
  past:    { ic: 'clock',  t: n => `${n} Simple-Past-Formen richtig`, steps: [5, 8], cur: d => d.past, mode: 'past', ok: () => S.words.filter(w => applicable(w, 'past')).length >= 8 }
};
/* Three quests per day, the same all day (seeded by the date): one easy anchor, one about answering well,
   one that may ask for a special exercise. */
function questsToday() {
  const p = S.prog, k = todayKey();
  if (!p.quests || p.quests.day !== k || !Array.isArray(p.quests.list) || p.quests.list.some(x => !QUESTS[x[0]])) {      // also: a quest this version does not know
    const rnd = seedRand('q' + k), ok = id => !QUESTS[id].ok || QUESTS[id].ok();
    const take = ids => { const a = ids.filter(ok); return a.length ? a[Math.floor(rnd() * a.length)] : null };
    const chosen = [take(['xp', 'rounds'])];
    chosen.push(take(['right', 'combo', 'perfect'].filter(id => chosen.indexOf(id) < 0)));
    chosen.push(take(['up', 'fresh', 'typed', 'past', 'combo', 'perfect', 'right'].filter(id => chosen.indexOf(id) < 0)));
    p.quests = { day: k, list: chosen.filter(Boolean).map(id => [id, QUESTS[id].steps[Math.floor(rnd() * QUESTS[id].steps.length)]]), done: {}, chest: false };
  }
  return p.quests;
}
/* Marks quests whose number is reached, pays 5 coins each and 15 for the chest when all are done. */
function checkQuests() {
  const q = questsToday(), d = dayStats(), out = { done: [], chest: false };
  for (const [id, need] of q.list) if (!q.done[id] && QUESTS[id] && QUESTS[id].cur(d) >= need) { q.done[id] = true; S.prog.questsDone = (S.prog.questsDone || 0) + 1; addCoins(5); out.done.push(id) }
  if (!q.chest && q.list.length && q.list.every(([id]) => q.done[id])) { q.chest = true; S.prog.chests = (S.prog.chests || 0) + 1; addCoins(15); out.chest = true }
  return out;
}

/* ---------- learning path ---------- */
/* A lesson becomes a row of stations of about 7 to 14 words: a new station starts with a new book page,
   or with a new section once the station is big enough. Stations are only a view on the words; nothing is stored. */
function pathNodes(u) {
  const words = (u.words || []).map(w => S.byId.get(w.id)).filter(Boolean);
  const nodes = []; let cur = null;
  for (const w of words) {
    const pg = String(w.page || ''), sec = w.sec || '';
    if (!cur || pg !== cur.page || cur.words.length >= 14 || (sec !== cur.last && cur.words.length >= 7)) { cur = { page: pg, secs: [], last: sec, words: [] }; nodes.push(cur) }
    if (sec && cur.secs.indexOf(sec) < 0) cur.secs.push(sec);
    cur.last = sec; cur.words.push(w);
  }
  for (let i = nodes.length - 1; i > 0; i--) {      // a short tail joins the station before it on the same page
    const n = nodes[i], prev = nodes[i - 1];
    if (n.words.length < 4 && prev.page === n.page && prev.words.length + n.words.length <= 17) { prev.words.push(...n.words); n.secs.forEach(s => { if (prev.secs.indexOf(s) < 0) prev.secs.push(s) }); nodes.splice(i, 1) }
  }
  nodes.forEach((n, i) => { n.id = u.id + '#' + i; n.unit = u.id; n.title = nodeTitle(n, i) });
  // Stations that would carry the same title are told apart as Teil 1, Teil 2 …
  const seen = {}; nodes.forEach(n => { (seen[n.title] = seen[n.title] || []).push(n) });
  for (const t in seen) if (seen[t].length > 1) seen[t].forEach((n, k) => { n.title = t + ' · Teil ' + (k + 1) });
  return nodes;
}
function nodeTitle(n, i) {
  const s = n.secs, plain = s.every(x => x === 'A' || /^[A-Z]?\d+$/.test(x));
  const sec = !s.length ? '' : s.length === 1 ? secName(s[0]) : plain ? 'Abschnitt ' + s[0] + '–' + s[s.length - 1] : s.map(secName).join(', ');
  return [n.page ? 'S. ' + n.page : 'Teil ' + (i + 1), sec].filter(Boolean).join(' · ');
}
function nodeInfo(n) {
  const now = Date.now(); let sit = 0, b5 = 0, fresh = 0, due = 0, sum = 0;
  for (const w of n.words) { const l = fach(w.id); sum += l; if (l >= 4) sit++; if (l >= 5) b5++; if (!l) fresh++; else if (isDue(w.id, now)) due++ }
  const total = n.words.length;
  return { total, sit, fresh, due, pct: total ? sum / (5 * total) : 0, state: b5 === total ? 'legend' : sit === total ? 'gold' : fresh === total ? 'new' : 'go' };
}
function allNodes() { return S.units.map(u => ({ u, nodes: pathNodes(u) })).filter(x => x.nodes.length) }
function findNode(id) { for (const x of allNodes()) for (const n of x.nodes) if (n.id === id) return n; return null }
/* What "Weiter lernen" starts: open learning-target words first, otherwise a mix over everything
   (composeRound: at most half due words, then new words in book order). */
function smartPlan() {
  const open = openTargetIds(), n = S.prog.len;
  if (open.length) return { ids: open, label: Math.min(n, open.length) + ' Fragen aus deinem Lernziel' };
  const now = Date.now(), due = S.words.filter(w => isDue(w.id, now)).length, fresh = S.words.filter(w => !fach(w.id)).length;
  const a = Math.min(due, Math.ceil(n / 2)), b = Math.min(fresh, n - a), parts = [];
  if (a) parts.push(a + (a === 1 ? ' Wiederholung' : ' Wiederholungen'));
  if (b) parts.push(b + (b === 1 ? ' neues Wort' : ' neue Wörter'));
  return { ids: S.words.map(w => w.id), label: parts.length ? parts.join(' + ') : n + ' Fragen, bunt gemischt' };
}

/* ---------- feel: haptics, one-shot effects, screen transitions, theme, update hint ---------- */
/* A light tap under the finger. Android vibrates; iOS 18 and later ticks when a native switch flips,
   so a hidden switch is flipped once. Older systems do nothing. */
function haptic(kind) {
  if (S.prog.haptics === false) return;
  try {
    if (navigator.vibrate) { navigator.vibrate(kind === 'bad' ? [16, 50, 16] : kind === 'win' ? [12, 40, 12, 40, 24] : 10); return }
    const tick = () => { const l = document.createElement('label'); l.setAttribute('aria-hidden', 'true'); l.style.display = 'none'; const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.appendChild(i); document.head.appendChild(l); l.click(); l.remove() };
    tick(); if (kind === 'bad' || kind === 'win') setTimeout(tick, 110);
  } catch (e) {}
}
/* Animations that should play once: a handler names them, the next render adds the class, then they are gone. */
const FX = new Set();
const fx = n => { FX.add(n) };
const fxc = (n, cls) => FX.has(n) ? ' ' + cls : '';
/* Changes the screen inside a view transition where the browser has one (Safari 18+). The change itself
   runs a moment later, so anything that needs the new screen belongs inside fn. */
let vtRun = 0;
function transit(fn, kind) {
  if (REDUCED || !document.startViewTransition || document.hidden) { fn(); return }
  const root = document.documentElement, my = ++vtRun;
  let ran = false; const once = () => { if (ran) return; ran = true; fn() };
  const done = () => { if (my !== vtRun) return; delete root.dataset.vt; const m = document.getElementById('main'); if (m && !app.contains(document.activeElement)) m.focus({ preventScroll: true }) };
  try {
    root.dataset.vt = kind || 'fade';
    const t = document.startViewTransition(once);
    // The browser calls back with the next painted frame. If no frame comes (page not on screen), the screen changes anyway.
    setTimeout(once, 300); setTimeout(done, 1500);
    t.ready.catch(() => {});
    t.finished.catch(() => {}).then(done);
  } catch (e) { delete root.dataset.vt; once() }
}
function applyTheme() {
  const t = S.prog.theme, root = document.documentElement, L = '#F3F5FB', D = '#0B1026';
  if (t === 'light' || t === 'dark') root.dataset.theme = t; else delete root.dataset.theme;
  document.querySelectorAll('meta[name="theme-color"]').forEach((m, i) => m.setAttribute('content', t === 'light' ? L : t === 'dark' ? D : (i ? D : L)));
}
/* The page asks the server which version is current. If it is newer than this page, the start screen offers a reload. */
function cmpVer(a, b) { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d } return 0 }
function checkUpdate() {
  if (!/^https?:$/.test(location.protocol)) return;
  fetch('sw.js?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => {
    const m = /wordbox-v([\d.]+)/.exec(t);
    if (m && cmpVer(m[1], APP_VERSION) > 0 && S.update !== m[1]) { S.update = m[1]; if (S.view === 'home') render() }
  }).catch(() => {});
}

/* ---------- views: start ---------- */
/* One line from Bit, picked by what matters most right now. Returns [mood, text]. */
function coach() {
  const p = S.prog, st = streakInfo(), got = xpToday(), left = Math.max(0, p.goal - got);
  const urgent = activeTargets().map(targetInfo).find(i => i.state === 'late' || i.state === 'last');
  if (urgent) return ['think', urgent.state === 'last' ? `Heute zählt es: noch ${urgent.open.length} Wörter für dein Lernziel.` : `Dein Lernziel wartet: noch ${urgent.open.length} Wörter.`];
  if (!st.today && st.n >= 2) return ['think', st.frozen ? `Dein Serien-Schutz hält ${st.n} Tage fest. Eine Runde, und die Flamme brennt weiter.` : `${st.n} Tage Serie! Eine Runde heute, und sie wächst.`];
  if (!left) return ['cheer', 'Tagesziel geschafft. Richtig stark!'];
  if (got > 0) return ['happy', `Noch ${left} XP bis zu deinem Tagesziel. Weiter so!`];
  if (!st.n && p.best >= 2) return ['happy', 'Schön, dass du wieder da bist. Starte eine neue Serie!'];
  return ['happy', 'Bereit für ein paar Wörter? Los geht’s!'];
}
function viewHome() {
  const p = S.prog, hi = p.name ? 'Hi ' + esc(p.name) + '!' : 'Hi!';

  const review = due ? `<section class="card review">${art('clock')}<div class="grow"><h3>${due} ${due === 1 ? 'Wort ist' : 'Wörter sind'} fällig</h3><p>Wiederholen bringt sie ein Fach weiter.</p></div><button class="btn btn-soft btn-sm" data-act="review">Üben</button></section>` : '';

function questRows() {

    const def = QUESTS[id]; if (!def) return '';
    const done = !!q.done[id], cur = done ? need : Math.min(need, def.cur(d));

/* The learning path: one coloured banner per lesson, below it the stations in a gentle zigzag. */
const UNIT_HUES = ['royal', 'rose', 'green', 'violet', 'orange', 'teal'];
const NODE_X = [0, 40, 64, 40, 0, -40, -64, -40];
function pathHtml() {
  const all = allNodes();
  let cur = '';                                   // the station Bit points at: first with new words, else first with due words
  for (const x of all) { const n = x.nodes.find(n => nodeInfo(n).fresh); if (n) { cur = n.id; break } }
  if (!cur) for (const x of all) { const n = x.nodes.find(n => nodeInfo(n).due); if (n) { cur = n.id; break } }
  return all.map(({ u, nodes }, ui) => {
    const hue = UNIT_HUES[ui % UNIT_HUES.length];
    const words = nodes.reduce((a, n) => a.concat(n.words), []), sit = words.filter(w => fach(w.id) >= 4).length;
    return `<section class="unit-path hue-${hue}" aria-label="${esc(u.title)}">
      <header class="unit-h"><div class="grow"><small>Lektion ${ui + 1}${u.pages ? ' · ' + esc(u.pages) : ''}</small><b>${esc(u.title)}</b>
        <span class="unit-prog"><span class="bar onhue"><span style="width:${(sit / words.length * 100).toFixed(1)}%"></span></span><i>${sit}/${words.length}</i></span></div>
        <button class="unit-btn" data-act="practice-unit" data-u="${esc(u.id)}" aria-label="${esc(u.title)} in „Üben“ öffnen">${icon('school')}</button></header>
      <ol class="nodes">${nodes.map((n, i) => nodeHtml(n, i, cur === n.id)).join('')}</ol></section>`;
  }).join('');
}
function nodeHtml(n, i, isCur) {
  const inf = nodeInfo(n), open = S.openNode === n.id, x = NODE_X[i % NODE_X.length], C = 2 * Math.PI * 37;
  const pic = inf.state === 'legend' ? art('crownW') : inf.state === 'gold' ? icon('check') : icon('star', inf.state === 'new' ? '' : 'fill');
  const label = `${n.title}: ${inf.sit} von ${inf.total} sitzen${inf.due ? ', ' + inf.due + ' fällig' : ''}`;
  return `<li class="node-li${open ? ' open' : ''}${isCur ? ' has-flag' : ''}" style="--x:${x}px">
    <div class="node-wrap">${isCur ? `<span class="node-flag">${inf.fresh ? 'Start' : 'Üben'}</span>` : ''}
      <button class="node ${inf.state}" data-act="node" data-n="${esc(n.id)}" aria-expanded="${open}" aria-label="${esc(label)}">
        <svg class="node-ring" viewBox="0 0 84 84" aria-hidden="true"><circle class="trk" cx="42" cy="42" r="37"/><circle class="val" cx="42" cy="42" r="37" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - inf.pct)).toFixed(1)}"/></svg>
        <span class="node-btn">${pic}</span>${inf.due ? `<span class="node-due" aria-hidden="true">${inf.due}</span>` : ''}</button></div>
    ${open ? nodePop(n, inf) : ''}</li>`;
}
function nodePop(n, inf) {
  const dots = n.words.map(w => `<i style="background:var(--f${fach(w.id)})"></i>`).join('');
  const facts = [inf.total + ' Wörter', inf.sit + ' sitzen'].concat(inf.fresh ? [inf.fresh + ' neu'] : [], inf.due ? [inf.due + ' fällig'] : []);
  const nq = Math.min(S.prog.len, inf.total);
  return `<div class="node-pop" role="group" aria-label="${esc(n.title)}"><b>${esc(n.title)}</b>
    <span class="small">${facts.join(' · ')}</span><div class="dots" aria-hidden="true">${dots}</div>
    <button class="btn btn-white wide" data-act="node-go" data-n="${esc(n.id)}">${inf.state === 'new' ? 'Los geht’s' : 'Üben'} · ${nq} ${nq === 1 ? 'Frage' : 'Fragen'}</button>
    <button class="link onhue" data-act="node-sel" data-n="${esc(n.id)}">Wörter ansehen und auswählen</button></div>`;
}

/* ---------- views: quiz and result ---------- */
function viewQuiz() {
  const Q = S.quiz, q = Q.list[Q.i], w = S.byId.get(q.wid) || {};
  const prog = (Q.i + (Q.answered ? 1 : 0)) / Q.list.length;
  const mood = !Q.answered ? 'think' : Q.lastOk ? 'cheer' : 'oops';
  const extraTag = q.extra ? `<span class="pill pill-gold" style="align-self:flex-start">${icon('autorenew')}Wiederholung · ${esc(q.unitTitle)}</span>` : '';
  let ask;
  if (q.type === 'gap') {
    ask = `<div class="qprompt sentence">${esc(q.before)}<span class="blank ${Q.answered ? 'ok' : ''}">${Q.answered ? esc(q.answer) : '&nbsp;'}</span>${esc(q.after)}</div><span class="hint">${icon('translate')}${esc(q.hint)}</span>`;
  } else {
    ask = `<div class="qsay"><div class="qprompt ${String(q.prompt).length > 22 ? 'long' : ''} grow">${esc(q.prompt)}</div>${q.showSay ? `<button class="iconbtn" data-act="say" data-t="${esc(q.prompt)}" aria-label="Vorlesen">${icon('volume_up')}</button>` : ''}</div>
      ${q.showSay && w.ipa ? `<span class="ipa">${esc(w.ipa)}</span>` : ''}${q.hint ? `<span class="hint">${icon('translate')}${esc(q.hint)}</span>` : ''}`;
  }
  let answers;
  if (q.type === 'type') {
    const st = Q.answered ? (Q.lastOk ? 'ok' : 'no') : '';
    answers = `<div class="typebox"><input id="typeIn" class="${st}${Q.answered ? fxc('ans', 'fx') : ''}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Auf Englisch schreiben" value="${esc(Q.typed)}" ${Q.answered ? 'readonly' : ''} aria-label="Antwort auf Englisch" data-in="typing">
      ${Q.typeErr ? `<div class="err" role="alert">${esc(Q.typeErr)}</div>` : ''}
      ${Q.answered ? '' : `<button class="btn btn-primary btn-xl wide" data-act="type-check">Prüfen</button><button class="link" data-act="type-skip">Weiß ich nicht</button>`}</div>`;
  } else {
    answers = `<div class="opts" role="group" aria-label="Antworten">${q.options.map((o, i) => {
      let cls = '', mark = '';
      if (Q.answered) { if (o === q.answer) { cls = 'is-right' + fxc('ans', 'fx'); mark = art('check') } else if (i === Q.chosen) { cls = 'is-wrong' + fxc('ans', 'fx'); mark = art('cross') } else cls = 'is-dim' }
      return `<button class="opt ${cls}" data-act="ans" data-i="${i}" ${Q.answered ? 'disabled' : ''}><span class="key">${i + 1}</span><span class="t">${esc(o)}</span>${mark}</button>` }).join('')}</div>`;
  }
  let sheet = '';
  if (Q.answered) {
    const ok = Q.lastOk, sayT = q.type === 'past' ? w.past : w.en;
    const wcard = `<div class="wcard"><div class="grow"><b>${esc(w.en)}</b>${q.type === 'past' ? ` → <b>${esc(w.past)}</b>` : ''}${w.ipa ? ` <span class="ipa">${esc(w.ipa)}</span>` : ''}<div class="de">${esc(w.de)}</div>${w.ex ? `<div class="ex">${esc(w.ex)}</div>` : ''}${w.pos === 'phrase' && w.note ? `<div class="ex">${esc(w.note)}</div>` : ''}</div><button class="iconbtn sm" data-act="say" data-t="${esc(sayT)}" aria-label="Vorlesen">${icon('volume_up')}</button></div>`;
    sheet = `<div class="sheet ${ok ? 'ok' : 'no'}${fxc('ans', 'in')}" role="status" aria-live="polite"><div class="sheet-in">
      <div class="sheet-head">${art(ok ? 'check' : 'cross')}<strong>${esc(Q.praise)}</strong>${Q.gain ? `<span class="gain">+${Q.gain} XP</span>` : ''}</div>
      ${ok && Q.almost ? `<div>Ein kleiner Tippfehler. Richtig geschrieben: <b>${esc(q.answer)}</b></div>` : ''}
      ${!ok ? `<div>Richtig ist: <b>${esc(q.answer)}</b>${Q.again ? ' · kommt gleich nochmal' : ''}</div>` : ''}
      ${wcard}
      <button class="btn ${ok ? 'btn-good' : 'btn-bad'} btn-xl wide" data-act="next" id="nextBtn">Weiter</button>
    </div></div>`;
  }
  const hot = Q.combo >= 3;
  const confirm = S.confirm === 'quit' ? `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="qT">${bit('oops')}<h2 id="qT">Jetzt aufhören?</h2><p class="muted">Deine XP bis hierhin bleiben. Für die Serie und den Runden-Bonus zählt aber nur eine fertige Runde.</p>
    <button class="btn btn-primary btn-xl wide" data-act="quit-no">Weiter üben</button><button class="btn btn-line wide" data-act="quit-yes">Runde beenden</button></div></div>` : '';
  return `<div class="quiz ${Q.answered ? 'answered' : ''}">
    <header class="qtop"><button class="xbtn" data-act="quit" aria-label="Runde beenden">${icon('close')}</button>
      <div class="qbar${hot ? ' hot' : ''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(prog * 100)}" aria-label="Fortschritt"><span style="width:${Math.max(4, prog * 100).toFixed(1)}%"></span></div>
      <span class="combo${hot ? ' on' : ''}${fxc('combo', 'fx')}" aria-label="${Q.combo} richtig in Folge">${art(hot ? 'flame' : 'flameOff')}<b>${Q.combo}</b></span></header>
    <main class="qbody${fxc('q', 'enter')}" id="main" tabindex="-1">
      ${extraTag}<h1 class="qlabel">${esc(q.label)}</h1>
      <div class="qask">${bit(mood, undefined, 'qbit' + (Q.answered ? fxc('ans', 'fx') : ''))}<div class="bubble">${ask}</div></div>
      ${answers}
    </main>
  </div>${sheet}${confirm}`;
}
/* The result is a short run of screens: summary first, then one screen per thing worth celebrating. */
function viewResult() {
  const R = S.result, p = S.prog, step = R.steps[R.step] || 'sum', last = R.step >= R.steps.length - 1;
  const n = R.right + R.wrong, acc = n ? Math.round(R.right / n * 100) : 0;
  let body;
  if (step === 'streak') {
    const st = streakInfo();
    body = `<div class="res-hero"><div class="big-art">${art('flame')}</div>
      <h1>${st.n === 1 ? 'Serie gestartet!' : `<span data-count="${st.n}" data-from="${st.n - 1}">${st.n}</span> Tage Serie!`}</h1>
      <p class="res-sub">${R.saved ? 'Dein Serien-Schutz hat sie gerettet. ' : ''}${st.n === 1 ? 'Übe morgen wieder, dann wächst deine Flamme.' : 'Komm morgen wieder, damit die Flamme weiterbrennt.'}</p></div>
      <section class="card late"><div class="week" style="border:0;padding:0">${weekRow()}</div></section>`;
  } else if (step === 'level') {
    body = `<div class="res-hero"><div class="lvl-badge"><small>Level</small><b>${R.levelUp.n}</b></div><h1 style="margin-top:14px">${esc(R.levelUp.name)}</h1>
      <p class="res-sub">Neues Level! Als Nächstes wartet „${esc(R.levelUp.next)}“.</p></div>
      <div class="xtras"><span class="coin">${art('coin')}+${R.levelCoins} Münzen</span></div>`;
  } else if (step === 'quests') {
    const k = R.quests.done.length;
    body = `<div class="res-hero">${bit('cheer', undefined, 'res-bit')}<h1>${R.quests.chest ? 'Alle Quests geschafft!' : k === 1 ? 'Quest geschafft!' : k + ' Quests geschafft!'}</h1></div>
      <section class="card quests">${questRows()}${questChest()}</section>
      <div class="xtras"><span class="coin">${art('coin')}+${5 * k + (R.quests.chest ? 15 : 0)} Münzen</span></div>`;
  } else if (step === 'badges') {
    const big = R.fresh.length <= 4 ? 'big' : '';
    body = `<div class="res-hero"><h1>${R.fresh.length === 1 ? 'Neues Abzeichen!' : R.fresh.length + ' neue Abzeichen!'}</h1></div>
      <div class="newmedals">${R.fresh.map((b, i) => `<div class="newmedal" style="--i:${i}">${medal(b, true, big)}<b>${b.t}</b><small>${b.d}</small></div>`).join('')}</div>
      <div class="xtras"><span class="coin">${art('coin')}+${5 * R.fresh.length} Münzen</span></div>`;
  } else if (step === 'review') {
    body = `<div class="res-hero">${bit('think', undefined, 'res-bit')}<h1>Das üben wir nochmal</h1><p class="res-sub">${R.mistakes.length === 1 ? 'Ein Wort war' : R.mistakes.length + ' Wörter waren'} noch wackelig.</p></div>
      <section class="card late"><div class="mist">${R.mistakes.map(q => { const w = S.byId.get(q.wid) || {};
        return `<div><span class="grow selectable"><b>${esc(q.type === 'gap' ? w.en : q.prompt)}</b> → ${esc(q.answer)}</span><button class="iconbtn sm" data-act="say" data-t="${esc(q.type === 'past' ? w.past : w.en)}" aria-label="Vorlesen">${icon('volume_up')}</button></div>` }).join('')}</div></section>`;
  } else {
    const head = R.perfect ? 'Perfect!' : acc >= 80 ? 'Brilliant!' : acc >= 60 ? 'Well done!' : 'Good effort!';
    const mm = Math.min(59, Math.floor(R.secs / 60)), ss = String(R.secs % 60).padStart(2, '0');
    const now = xpToday(), was = Math.max(0, now - R.xp), pc = v => (Math.min(1, v / p.goal) * 100).toFixed(1) + '%';
    const extras = R.extras.map(([t, x], i) => `<span style="--i:${i}">${esc(t)} <b>+${x}</b></span>`).join('') + (R.coinSum ? `<span class="coin" style="--i:${R.extras.length}">${art('coin')}+${R.coinSum} Münzen</span>` : '');
    const banners = (R.mastered || []).map(t => `<div class="notice good late">${art('crown')}<div><b>Lektion gemeistert!</b> In „${esc(t)}“ sitzen alle Wörter.</div></div>`).join('') +
      (R.targetsDone || []).map(t => `<div class="notice good late">${icon('flag', 'fill')}<div><b>Lernziel „${esc(t.title)}“ geschafft!</b> Alle Wörter zweimal richtig.</div></div>`).join('') +
      activeTargets().map(t => { const i = targetInfo(t); return `<section class="card late"><div class="meter-h"><b>${esc(t.title)}</b><span>${i.done} / ${i.total} geübt</span></div><div class="bar"><span style="width:${(i.pct * 100).toFixed(1)}%"></span></div></section>` }).join('');
    body = `<div class="res-hero">${bit(acc >= 80 ? 'cheer' : acc >= 50 ? 'happy' : 'think', undefined, 'res-bit')}<h1>${head}</h1><p>${R.right} von ${n} richtig</p></div>
      <div class="tiles3">
        <div class="stat gold"><span>XP</span><b>${art('bolt')}<i style="font-style:normal" data-count="${R.xp}">${R.xp}</i></b></div>
        <div class="stat green"><span>${acc >= 90 ? 'Stark' : 'Treffer'}</span><b>${acc}%</b></div>
        <div class="stat blue"><span>${R.secs <= 90 ? 'Flott' : 'Zeit'}</span><b>${mm}:${ss}</b></div>
      </div>
      ${extras ? `<div class="xtras">${extras}</div>` : ''}${banners}
      <section class="card late"><div class="meter"><div class="meter-h"><b>${R.goalHit ? 'Tagesziel geschafft!' : 'Tagesziel'}</b><span>${fmt(now)} / ${fmt(p.goal)} XP</span></div>
        <div class="meter-row"><div class="bar gold"><span style="width:${pc(was)}" data-grow="${pc(now)}"></span></div>${art(now >= p.goal ? 'chestOpen' : 'chest', 'meter-end')}</div></div></section>`;
  }
  const dots = R.steps.length > 1 ? `<div class="res-dots" aria-hidden="true">${R.steps.map((s, i) => `<i class="${i === R.step ? 'on' : ''}"></i>`).join('')}</div>` : '';
  const foot = !last ? `<button class="btn btn-primary btn-xl wide" data-act="res-next" id="nextBtn">Weiter</button>`
    : step === 'review' ? `<button class="btn btn-primary btn-xl wide" data-act="redo" id="nextBtn">${icon('autorenew')}Fehler nochmal üben</button><button class="btn btn-line wide" data-act="done">Fertig</button>`
    : `<button class="btn btn-primary btn-xl wide" data-act="done" id="nextBtn">Fertig</button>`;
  return `<div class="result${fxc('res', 'enter')}"><main class="res-body" id="main" tabindex="-1">${body}</main><div class="res-foot">${dots}${foot}</div></div>`;
}

function viewSheet() {
  const s = S.sheet; if (!s || s.type !== 'badge') return '';
  const b = BADGES.find(x => x.id === s.id); if (!b) return '';
  const p = S.prog, got = p.badges[b.id], pr = !got && b.pr ? b.pr(p, badgeCtx()) : null;
  const when = got && /^\d{4}-\d{2}-\d{2}$/.test(got) ? new Date(got + 'T00:00:00').toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  const state = got ? `<span class="pill pill-gold">${icon('check')}Geschafft${when ? ' am ' + esc(when) : ''}</span>`
    : pr && pr[1] > 0 ? `<div class="bar"><span style="width:${(Math.min(1, pr[0] / pr[1]) * 100).toFixed(0)}%"></span></div><span class="small muted">${fmt(Math.min(pr[0], pr[1]))} von ${fmt(pr[1])}</span>`
    : `<span class="pill">${icon('lock')}Noch offen</span>`;
  return `<div class="overlay bottom" data-act="sheet-close"><div class="bsheet" role="dialog" aria-modal="true" aria-labelledby="shT" data-act="noop">${medal(b, !!got, 'big')}<h2 id="shT">${b.t}</h2><p>${b.d}</p>${state}
    <button class="btn btn-primary wide" data-act="sheet-close" style="margin-top:8px" id="sheetOk">Okay</button></div></div>`;
}
function overlays() {
  if (!S.prog.onboarded) return S.view === 'home' ? viewOnboard() : '';
  if (!S.prog.v2 && S.view === 'home') return viewWhatsNew();
  return S.sheet ? viewSheet() : '';
}

/* ---------- adding vocabulary ---------- */
function viewImport() {
  const I = S.imp;
  let inner = '';
  if (I.step === 'review') {
    const on = I.words.filter(w => w.on).length, dups = I.words.filter(w => w.dup).length;
    const rows = I.words.map((w, i) => `<div class="irow ${w.on ? '' : 'off'}"><label style="display:contents"><input type="checkbox" class="sr" data-ch="imp-tog" data-i="${i}" ${w.on ? 'checked' : ''}><span class="cbox">${icon('check')}</span></label>
