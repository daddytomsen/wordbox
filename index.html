  wear: t => { const p = S.prog, id = t.dataset.o || ''; if (id && !(p.outfits || {})[id]) return; if (p.outfit === id) return; p.outfit = id; fx('skin'); persist(); render(); haptic('tap') },
  'del-ask': t => { S.delUnit = t.dataset.u; S.openUnit = t.dataset.u; render() },
  'del-no': () => { S.delUnit = null; render() },
  'del-yes': t => {
    const id = t.dataset.u, u = S.units.find(x => x.id === id), p = S.prog; S.delUnit = null;
    S.units = S.units.filter(x => x.id !== id); saveUnits();
    if (u && u.source === 'server') p.removedLists = Array.from(new Set((p.removedLists || []).concat(id)));
    if (u) {
      const ids = new Set((u.words || []).map(w => w.id));
      for (const k of Object.keys(p.w)) if (ids.has(k)) delete p.w[k];
      if (Array.isArray(p.sel)) p.sel = p.sel.filter(x => !ids.has(x));
      // Learning targets lose the deleted words; a target without words goes too.
      for (const tg of targets()) if (!tg.done) tg.ids = tg.ids.filter(x => !ids.has(x));
      p.targets = targets().filter(tg => tg.done || tg.ids.length);
    }
    if (p.mastered) delete p.mastered[id];
    if (S.unitFilter === id) S.unitFilter = null;
    persist(); updateBadge(); render(); toast('Lektion gelöscht.', 'delete');
  },
  goal: t => { S.prog.goal = +t.dataset.n; const paid = payGoal(); persist(); render(); if (paid) { SFX.coin(); toast('Tagesziel geschafft: 10 Münzen!', 'check_circle') } },
  tempo: t => { const to = t.dataset.t, from = S.prog.tempo || 'fast'; if (!TEMPOS[to] || to === from) return; reschedule(S.prog, from, to); S.prog.tempo = to; persist(); render(); toast(to === 'fast' ? 'Schnell: jeden Tag ein Fach weiter.' : 'Langzeit: Abstände 1, 3, 7 und 14 Tage.', 'inventory_2') },
  theme: t => { S.prog.theme = t.dataset.t; persist(); applyTheme(); render() },
  tog: t => { const k = t.dataset.k; S.prog[k] = S.prog[k] === false; persist(); render(); if (k === 'sound' && S.prog.sound) SFX.ok(); if (k === 'haptics') haptic('ok') },
  'reset-ask': () => { S.resetAsk = true; render() },
  'reset-no': () => { S.resetAsk = false; render() },
  'reset-yes': () => {
    const o = S.prog, keep = { name: o.name, goal: o.goal, sound: o.sound, speak: o.speak, haptics: o.haptics, theme: o.theme, tempo: o.tempo, removedLists: o.removedLists || [], onboarded: true, v2: true, lvl: 1 };
    S.prog = Object.assign(freshProg(), keep); S.resetAsk = false; persist(); updateBadge(); go('home'); toast('Fortschritt zurückgesetzt.', 'autorenew');
  },
  'sound-test': () => { unlockAudio(); const was = S.prog.sound; S.prog.sound = true; SFX.win(); S.prog.sound = was; say('Hello! The sound is working.'); haptic('win'); toast('Du solltest jetzt eine Melodie und eine Stimme hören. Keine Stimme? Dann ist der Stummschalter an.', 'volume_up') },
  backup: () => {
    let json;
    try { json = JSON.stringify({ app: 'wordbox', v: 1, exported: new Date().toISOString(), prog: S.prog, units: S.units }) }
    catch (e) { toast('Sicherung konnte nicht erstellt werden.', 'info'); return }
    downloadFile('voc-a-bit-sicherung-' + todayKey() + '.json', json)
      .then(how => { if (how === 'shared') toast('Sicherung gesichert.', 'check_circle'); else if (how === 'download') toast('Sicherung wird gespeichert.', 'download') })
      .catch(() => toast('Sicherung konnte nicht gespeichert werden.', 'info'));
  },
  'restore-no': () => { S.restore = null; render() },
  'restore-yes': () => {
    const d = S.restore && S.restore.data; if (!d) return;
    // The backup is tried out in memory first. Only one that the app can draw is saved over the current state.
    const old = { prog: S.prog, units: S.units };
    try {
      S.prog = Object.assign(freshProg(), migrateProg(JSON.parse(JSON.stringify(d.prog))), { onboarded: true });
      S.units = cleanUnits(d.units);
      index(); viewHome(); viewPractice(); viewVocab(); viewAwards();
    } catch (e) {
      S.prog = old.prog; S.units = old.units; index(); S.restore = null; render();
      toast('Diese Sicherung ist beschädigt und wurde nicht geladen. Dein Stand ist unverändert.', 'info'); return;
    }
    S.restore = null; S.unitFilter = null; S.openNode = null;
    saveUnits(); settleUp(true); persist(); applyTheme(); updateBadge(); go('home'); toast('Sicherung geladen.', 'check_circle');
  },
  'ob-goal': t => { S.prog.goal = +t.dataset.n; render() },
  'ob-go': () => { const p = S.prog; p.name = (p.name || '').trim().slice(0, 24); p.onboarded = true; p.v2 = true; p.lvl = levelInfo(p.xp).n; persist(); render(); SFX.ok(); haptic('ok') },
  'ob-skip': () => { S.prog.name = ''; S.prog.onboarded = true; S.prog.v2 = true; S.prog.lvl = levelInfo(S.prog.xp).n; persist(); render() },
  'v2-ok': () => { const p = S.prog; p.v2 = true; addCoins(50); persist(); render(); confetti(); SFX.level(); haptic('win'); toast('50 Münzen für dich. Schau mal im Shop vorbei!', 'check_circle') },
  'imp-open': () => { S.imp = S.imp || { step: 'pick', text: '', title: '', words: [], err: '', showPrompt: false }; go('import', 'push') },
  'imp-back': () => { S.imp = null; go('vocab') },
  'imp-parse': () => { const I = S.imp; if (!I.text.trim()) { I.err = 'Füge zuerst eine Liste ein.'; render(); return } startReview(parseText(I.text)) },
  'imp-copy': () => {
    const text = importPrompt();
    const fallback = () => {
      S.imp.showPrompt = true; render();
      const b = document.getElementById('promptBox');
      if (b) { b.focus(); b.select(); try { b.setSelectionRange(0, b.value.length) } catch (e) {} }
      toast('Der Text ist markiert. Jetzt kopieren.', 'copy');
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Anleitung kopiert. Jetzt mit den Fotos an Claude schicken.', 'check_circle'), fallback);
      else fallback();
    } catch (e) { fallback() }
  },
  'imp-edit': t => { const w = S.imp.words[+t.dataset.i]; if (w) { w.edit = !w.edit; render() } },
  'imp-all': t => { const on = t.dataset.on === '1'; S.imp.words.forEach(w => w.on = on); render() },
  'imp-save': () => saveImport(),
  'imp-reset': () => { S.imp.step = 'pick'; S.imp.words = []; S.imp.err = ''; render() }
};
const CH = {
  tw: t => { const sel = new Set(selIds()); t.checked ? sel.add(t.dataset.id) : sel.delete(t.dataset.id); S.prog.sel = Array.from(sel); persist(); render() },
  tg: t => { const g = (S._groups || [])[+t.dataset.g]; if (!g) return; const sel = new Set(selIds()); for (const w of g.words) t.checked ? sel.add(w.id) : sel.delete(w.id); S.prog.sel = Array.from(sel); persist(); render() },
  name: t => { S.prog.name = t.value.trim().slice(0, 24); persist() },      // no render: it would swallow the tap that ended the typing
  'imp-tog': t => { const w = S.imp.words[+t.dataset.i]; if (w) { w.on = t.checked; render() } },
  'imp-file': t => {
    const f = t.files && t.files[0]; if (!f) return;
    const fileTitle = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
    readFile(f, (text, err) => {
      if (err) { S.imp.err = 'Die Datei konnte nicht gelesen werden.'; render(); return }
      startReview(parseText(text), fileTitle);
    });
  },
  'restore-file': t => {
    const f = t.files && t.files[0]; if (!f) return;
    readFile(f, (text, err) => {
      let d = null;
      try { d = JSON.parse(text) } catch (e) { d = null }
      if (err || !d || d.app !== 'wordbox' || !d.prog || typeof d.prog !== 'object' || !Array.isArray(d.units)) { toast('Das ist keine Voc-a-Bit-Sicherung.', 'info'); return }
      const dt = d.exported ? new Date(d.exported) : null;
      S.restore = { date: dt && !isNaN(dt) ? dt.toLocaleDateString('de-DE') : 'unbekanntem Datum', data: d };
      render();
    });
  }
};
/* Text fields write into state while typing, so a re-render keeps what was typed. */
const IN = {
  search: t => { S.search = t.value; const el = document.getElementById('vlist'); if (el) el.innerHTML = vocabList() },
  typing: t => { const Q = S.quiz; if (Q && !Q.answered) Q.typed = t.value; if (Q && Q.typeErr) { S.quiz.typeErr = ''; const e = app.querySelector('.typebox .err'); if (e) e.remove() } },
  'ob-name': t => { S.prog.name = t.value },
  name: t => { S.prog.name = t.value.slice(0, 24) },
  't-title': t => { if (S.tform) S.tform.title = t.value },
  't-due': t => { if (S.tform) S.tform.due = t.value },
  'imp-text': t => { if (S.imp) S.imp.text = t.value },
  'imp-title': t => { if (S.imp) S.imp.title = t.value },
  'imp-f': t => { const w = S.imp && S.imp.words[+t.dataset.i]; if (w) w[t.dataset.f] = t.value }
};
app.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || !app.contains(t) || t.disabled) return; const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t, e) } });
app.addEventListener('change', e => { const t = e.target; const f = t.dataset && (CH[t.dataset.ch] || (t.type === 'date' && IN[t.dataset.in])); if (f) f(t, e) });
app.addEventListener('input', e => { const t = e.target; const f = t.dataset && IN[t.dataset.in]; if (f) f(t, e) });
app.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.unit')) { if (d.open) S.openUnit = d.dataset.u; else if (S.openUnit === d.dataset.u) S.openUnit = null } }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.sheet) { S.sheet = null; render() } else if (S.confirm) { S.confirm = null; render() } return }
  if (S.view === 'result' && S.result) { if (e.key === 'Enter') { const b = document.getElementById('nextBtn'); if (b) { e.preventDefault(); b.click() } } return }
  if (S.view !== 'quiz' || !S.quiz || S.confirm) return;
  const Q = S.quiz, q = Q.list[Q.i];
  if (Q.answered) { if (e.key === 'Enter') { e.preventDefault(); nextQ() } return }
  if (q.type === 'type') { if (e.key === 'Enter' && e.target && e.target.id === 'typeIn') { e.preventDefault(); answerTyped() } return }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= q.options.length) { e.preventDefault(); answerMC(n - 1) }
});

/* ---------- lessons from the server (lists/ folder next to this page) ---------- */
function listToUnit(L, data) {
  const arr = Array.isArray(data) ? data : (data && Array.isArray(data.words) ? data.words : []);
  const title = (data && typeof data.title === 'string' && data.title.trim()) || L.title || 'Lektion';
  const pages = (data && typeof data.pages === 'string' && data.pages.trim()) || L.pages || '';
  const words = [], ids = new Set();
  arr.forEach((o, i) => {
    if (!o || typeof o.en !== 'string' || typeof o.de !== 'string' || !o.en.trim() || !o.de.trim()) return;
    let id = typeof o.id === 'string' && o.id.trim() ? o.id.trim() : L.id + '-' + String(i + 1).padStart(3, '0');
    if (ids.has(id)) id = L.id + '-' + String(i + 1).padStart(3, '0') + 'x';
    ids.add(id);
    const w = { id, en: o.en.trim(), de: o.de.trim(), pos: POS.indexOf(o.pos) >= 0 ? o.pos : 'other' };
    for (const k of ['ipa', 'past', 'pp', 'ex', 'gap', 'opp', 'sec', 'page', 'note']) if (typeof o[k] === 'string' && o[k].trim()) w[k] = o[k].trim();
    if (typeof o.page === 'number') w.page = String(o.page);
    if (o.opt) w.opt = true;
    if (w.pos !== 'verb' && w.past) w.pos = 'verb';
    if (w.gap && (!w.ex || w.ex.indexOf(w.gap) < 0)) delete w.gap;
    words.push(w);
  });
  return { id: L.id, title, pages, rev: +L.rev || 1, source: 'server', createdAt: todayKey(), words };
}
let syncing = false, lastSync = 0;
async function syncLists() {
  if (syncing || !/^https?:$/.test(location.protocol)) return;
  syncing = true; lastSync = Date.now();
  try {
    const r = await fetch('lists/index.json', { cache: 'no-cache' });
    if (!r.ok) return;
    const idx = await r.json();
    const lists = Array.isArray(idx) ? idx : (idx && Array.isArray(idx.lists) ? idx.lists : []);
    const removed = new Set(S.prog.removedLists || []);
    const added = [], updated = [];
    for (const L of lists) {
      if (!L || typeof L.id !== 'string' || typeof L.file !== 'string' || removed.has(L.id)) continue;
      const have = S.units.find(u => u.id === L.id);
      if (have && (+have.rev || 1) >= (+L.rev || 1)) continue;
      let data;
      // The revision is part of the address, so an older copy from a cache can never pass for the new list.
      try { const rr = await fetch('lists/' + encodeURIComponent(L.file) + '?rev=' + (+L.rev || 1), { cache: 'no-cache' }); if (!rr.ok) continue; data = await rr.json() } catch (e) { continue }
      const unit = listToUnit(L, data);
      if (!unit.words.length) continue;
      if (have) {
        // Was the whole lesson selected before? Then the words added by this update join the selection.
        const sel = Array.isArray(S.prog.sel) ? new Set(S.prog.sel) : null;
        const wasAll = sel && (have.words || []).length && have.words.every(w => sel.has(w.id));
        unit.order = have.order; Object.assign(have, unit); updated.push(unit);
        if (wasAll) { for (const w of unit.words) sel.add(w.id); S.prog.sel = Array.from(sel); persist() }
      }
      else { unit.order = Math.max(0, ...S.units.map(u => u.order || 0)) + 1; S.units.push(unit); added.push(unit) }
    }
    if (!added.length && !updated.length) return;
    saveUnits();
    if (added.length) { S.prog.sel = added.reduce((a, u) => a.concat(u.words.map(w => w.id)), []); persist() }
    updateBadge(); softRender();
    if (added.length) toast(added.length === 1 ? 'Neue Lektion: ' + added[0].title : added.length + ' neue Lektionen geladen', 'library_add');
    else toast(updated.map(u => u.title).join(', ') + ' wurde aktualisiert.', 'autorenew');
  } catch (e) {
  } finally { syncing = false }
}

/* ---------- boot ---------- */
S.storageOk = store.set('wordbox.check', todayKey());
if (!store.get(LS_UNITS)) store.set(LS_UNITS, S.units);
/* Last resort when the saved data cannot be drawn: nothing is deleted without two taps, and the raw data can be saved first. */
function rescue(err) {
  app.innerHTML = `<main class="main" style="padding-top:calc(32px + env(safe-area-inset-top,0px))"><div class="card stack">
    <h2>Da stimmt etwas nicht</h2><p class="muted">Voc a Bit kann den gespeicherten Lernstand nicht anzeigen. Es wurde nichts gelöscht.</p>
    <button class="btn btn-primary wide" id="rsSave">Lernstand als Datei sichern</button>
    <button class="btn btn-line wide" id="rsAgain">Noch einmal versuchen</button>
    <button class="btn btn-danger wide" id="rsReset">Lernstand zurücksetzen</button>
    <p class="small muted">Zeig diese Meldung einem Erwachsenen: ${esc(String((err && err.message) || err).slice(0, 160))}</p></div></main>`;
  const by = id => document.getElementById(id);
  by('rsSave').onclick = () => { try { downloadFile('voc-a-bit-rettung-' + todayKey() + '.json', JSON.stringify({ app: 'wordbox', v: 1, exported: new Date().toISOString(), prog: store.get(LS_PROG) || {}, units: store.get(LS_UNITS) || [] })).catch(() => {}) } catch (e) {} };
  by('rsAgain').onclick = () => location.reload();
  by('rsReset').onclick = function () {
    if (!this.dataset.sure) { this.dataset.sure = '1'; this.textContent = 'Wirklich alles löschen? Nochmal tippen'; return }
    try { localStorage.removeItem(LS_PROG); localStorage.removeItem(LS_UNITS) } catch (e) {}
    location.reload();
  };
}
let bootOk = true;
try {
  index();
  if (!S.prog.since2) S.prog.since2 = todayKey();
  applyTheme();
  fx('view'); render();
} catch (e) { bootOk = false; rescue(e) }
/* Rewards that fell due while the app was closed, or that a new version added for things already done,
   are booked here. quiet = no toast (used when the app comes back from the background). */
function settleUp(quiet) {
  if (!S.prog.onboarded) return;
  activeTargets().forEach(targetInfo);
  dropLostStreak();
  const p = S.prog, lv = levelInfo(p.xp); let lvCoins = 0;
  // A level reached in a round that was never finished (app closed) is paid here. The first start only notes the level.
  if (!p.lvl) p.lvl = lv.n; else if (lv.n > p.lvl) { lvCoins = 20 * (lv.n - p.lvl); addCoins(lvCoins); p.lvl = lv.n }
  const fresh = checkBadges(), q = checkQuests(), paid = payGoal();
  addCoins(5 * fresh.length);
  persist(); updateBadge();
  if (quiet || !S.prog.v2) return;
  const msg = lvCoins ? 'Level ' + lv.n + ': ' + lv.name + '! ' + lvCoins + ' Münzen.' : fresh.length ? (fresh.length === 1 ? 'Neues Abzeichen: ' + fresh[0].t : fresh.length + ' neue Abzeichen! Schau unter Erfolge.')
    : q.chest ? 'Tagestruhe geöffnet: 15 Münzen!' : q.done.length ? 'Quest geschafft: 5 Münzen!' : paid ? 'Tagesziel geschafft: 10 Münzen!' : '';
  if (msg) setTimeout(() => { toast(msg, 'emoji_events'); SFX.badge(); softRender() }, 900); else targetReminder();
}
if (bootOk) { try { settleUp(false) } catch (e) { bootOk = false; rescue(e) } }
if (bootOk) { syncLists(); checkUpdate() }
/* Back from the background: a new day gets fresh numbers, and lessons and version are checked again after ten minutes. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !bootOk) return;
  if (S.dayShown !== todayKey() && S.view !== 'quiz' && S.view !== 'result') { settleUp(true); softRender(); targetReminder() }
  else if (S.stale) softRender();
  if (Date.now() - lastSync > 10 * 60 * 1000) { syncLists(); checkUpdate() }
});
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}) });
}
})();
</script>
