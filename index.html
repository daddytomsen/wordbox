<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voc a Bit – Vokabeltrainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voc a Bit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1128" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Lexend:wght@300..700&display=swap">
<style>
/* Layout: one-column phone app (max 560px) with sticky top bar and fixed bottom nav; the quiz takes over the whole screen.
   Identity: Königsblau school ink + yellow highlighter + the German Karteikasten (5 compartments) as the learning model. */
:root{
  --bg:#EDF0F8; --surface:#FFFFFF; --surface-2:#F5F7FC; --ink:#161D42; --ink-2:#4A5378; --ink-3:#8790B0;
  --line:#DCE1EF; --line-2:#C7CEE5;
  --royal:#2E47CF; --royal-deep:#1C2F9C; --royal-ink:#FFFFFF; --royal-ink-2:rgba(255,255,255,.78); --royal-soft:#E3E8FD;
  --hl:#FFD43B; --marker-deep:#D99A00; --marker-soft:#FFF2C2; --marker-ink:#5C4300;
  --flame:#F2542D; --flame-soft:#FFE7DF;
  --good:#12A16B; --good-deep:#0B7A50; --good-soft:#DBF4E8; --good-ink:#09603F;
  --bad:#E5484D; --bad-deep:#B92D33; --bad-soft:#FDE4E5; --bad-ink:#9C2127; --on-good:#FFFFFF;
  --f0:#C7CEE5; --f1:#FF7F61; --f2:#FFAE3D; --f3:#F5CB2E; --f4:#6FD3A0; --f5:#12A16B;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode","Arial Unicode MS",system-ui,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:10px; --nav-h:66px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1128; --surface:#161C3A; --surface-2:#1D2447; --ink:#EEF1FF; --ink-2:#B2B9DA; --ink-3:#7880A6;
  --line:#2A3260; --line-2:#3A447C;
  --royal:#7C90FF; --royal-deep:#4E62D8; --royal-ink:#0D1128; --royal-ink-2:rgba(13,17,40,.72); --royal-soft:#252F6B;
  --hl:rgba(255,212,59,.38); --marker-deep:#FFD43B; --marker-soft:#3E3312; --marker-ink:#FFE38A;
  --flame:#FF7A52; --flame-soft:#3E1F18;
  --good:#3DD69B; --good-deep:#20A673; --good-soft:#0F3A2B; --good-ink:#93ECC8;
  --bad:#FF6B70; --bad-deep:#D2454B; --bad-soft:#45181D; --bad-ink:#FFB5B8; --on-good:#0D1128;
  --f0:#3A447C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1128; --surface:#161C3A; --surface-2:#1D2447; --ink:#EEF1FF; --ink-2:#B2B9DA; --ink-3:#7880A6;
  --line:#2A3260; --line-2:#3A447C;
  --royal:#7C90FF; --royal-deep:#4E62D8; --royal-ink:#0D1128; --royal-ink-2:rgba(13,17,40,.72); --royal-soft:#252F6B;
  --hl:rgba(255,212,59,.38); --marker-deep:#FFD43B; --marker-soft:#3E3312; --marker-ink:#FFE38A;
  --flame:#FF7A52; --flame-soft:#3E1F18;
  --good:#3DD69B; --good-deep:#20A673; --good-soft:#0F3A2B; --good-ink:#93ECC8;
  --bad:#FF6B70; --bad-deep:#D2454B; --bad-soft:#45181D; --bad-ink:#FFB5B8; --on-good:#0D1128;
  --f0:#3A447C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
:focus-visible{outline:3px solid var(--royal);outline-offset:2px;border-radius:8px}
.ms{width:1em;height:1em;font-size:24px;display:inline-block;flex:none;vertical-align:middle;overflow:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hl{background:linear-gradient(100deg,transparent 2%,var(--hl) 3%,var(--hl) 97%,transparent 98%) 0 85%/100% 42% no-repeat;padding-inline:.08em}
.ipa{font-family:var(--f-ipa);color:var(--ink-3);font-size:.9em}
.lbl{font:600 12px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:14px}

/* top bar + nav */
.top{position:sticky;top:0;z-index:20;background:var(--bg);margin-inline:-16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;font:800 21px var(--f-display);letter-spacing:-.03em;color:var(--ink)}
.logo{width:30px;height:30px;flex:none}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 12px 5px 8px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.chip .ms{font-size:20px;color:var(--ink-3)}
.chip-flame.on .ms{color:var(--flame)}
.chip-xp .ms{color:var(--marker-deep)}
.main{display:flex;flex-direction:column;gap:16px;padding-block:6px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 12px var(--f-body);color:var(--ink-3)}
.nav .nic{display:grid;place-items:center;padding:3px 18px;border-radius:999px;transition:background .2s}
.nav button .ms{font-size:24px}
.nav button[aria-current="page"]{color:var(--royal)}
.nav button[aria-current="page"] .nic{background:var(--royal-soft)}

/* generic */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card h3{font-size:19px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-md);padding:14px 20px;min-height:52px;font:600 17px/1.1 var(--f-body);transition:transform .08s,box-shadow .08s}
.btn .ms{font-size:22px}
.btn.wide{width:100%}
.btn-primary{background:var(--royal);color:var(--royal-ink);box-shadow:0 4px 0 var(--royal-deep)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--royal-deep)}
.btn-good{background:var(--good);color:var(--on-good);box-shadow:0 4px 0 var(--good-deep)}
.btn-bad{background:var(--bad);color:var(--on-good);box-shadow:0 4px 0 var(--bad-deep)}
.btn-good:active,.btn-bad:active{transform:translateY(3px);box-shadow:none}
.btn-soft{background:var(--royal-soft);color:var(--royal)}
.btn-line{background:var(--surface);color:var(--ink);border:2px solid var(--line-2)}
.btn-danger{background:var(--bad-soft);color:var(--bad-ink)}
.btn-sm{min-height:40px;padding:8px 14px;font-size:15px;border-radius:12px}
.link{background:none;border:0;color:var(--royal);font-weight:600;padding:8px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--royal-soft);color:var(--royal);flex:none}
.iconbtn.sm{width:36px;height:36px}
.iconbtn.sm .ms{font-size:20px}
.iconbtn.plain{background:transparent;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font:600 13px var(--f-body);background:var(--surface-2);color:var(--ink-2)}
.pill .ms{font-size:16px}
.pill-marker{background:var(--marker-soft);color:var(--marker-ink)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);background:var(--marker-soft);color:var(--marker-ink);font-size:15px}
.notice .ms{font-size:22px}
.err{color:var(--bad-ink);background:var(--bad-soft);padding:10px 14px;border-radius:12px;font-size:15px}

/* home */
.hello h1{font-size:32px}
.hello p{color:var(--ink-2);margin-top:4px}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 18px;align-items:center}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .trk{stroke:var(--surface-2)}
.ring .val{stroke:var(--marker-deep);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring.done .val{stroke:var(--good)}
.ring .lab{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring .lab b{font:800 24px var(--f-display);font-variant-numeric:tabular-nums}
.ring .lab small{font-size:12px;color:var(--ink-3);margin-top:3px}
.goal h3{font-size:20px}
.goal p{color:var(--ink-2);font-size:15px;margin-top:4px}
.week{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding-top:12px;border-top:1.5px dashed var(--line)}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font:600 12px var(--f-body);color:var(--ink-3)}
.day i{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-style:normal}
.day i .ms{font-size:19px}
.day.on i{background:var(--flame);color:#fff}
.day.today span{color:var(--ink)}
.day.today i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--royal)}
.cta{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px;border:0;border-radius:var(--r-lg);background:var(--royal);color:var(--royal-ink);box-shadow:0 5px 0 var(--royal-deep);transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--royal-deep)}
.cta .ic{width:54px;height:54px;border-radius:17px;background:var(--royal-ink-2);color:var(--royal);display:grid;place-items:center;flex:none}
.cta .ic .ms{font-size:30px}
.cta strong{display:block;font:800 23px/1.1 var(--f-display);letter-spacing:-.02em}
.cta small{display:block;color:var(--royal-ink-2);font-size:14px;margin-top:4px}
.target h3{font-size:18px;display:flex;align-items:center;gap:6px}
.target h3 .ms{color:var(--royal)}
.target p{font-size:15px;color:var(--ink-2);margin:6px 0 10px}
.target.behind{border-color:var(--marker-deep)}
.target.behind .bar > span{background:var(--marker-deep)}
.target.last,.target.late{border-color:var(--bad)}
.target.last .bar > span,.target.late .bar > span{background:var(--bad)}
.target.done{border-color:var(--good)}
.target.done .bar > span{background:var(--good)}
.target.done h3 .ms{color:var(--good)}
.target-form h3{font-size:18px}
.startbar{display:flex;flex-direction:column;gap:8px}
.startbar .btn-soft{width:100%;min-height:48px}
.review{display:flex;align-items:center;gap:14px}
.review .badge-ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--marker-soft);color:var(--marker-ink);flex:none}
.review.calm .badge-ic{background:var(--good-soft);color:var(--good-ink)}
.review h3{font-size:18px}
.review p{font-size:14px;color:var(--ink-2)}
.lvl{display:flex;align-items:center;gap:14px}
.lvl .num{width:52px;height:52px;border-radius:16px;background:var(--ink);color:var(--surface);display:grid;place-content:center;text-align:center;flex:none;line-height:1}
.lvl .num small{font:600 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.lvl .num b{font:800 22px var(--f-display)}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.bar > span{display:block;height:100%;border-radius:999px;background:var(--royal);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.stackbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--f0);gap:2px}
.stackbar span{display:block;height:100%}
.unit-row{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1.5px solid var(--line)}
.unit-row:first-of-type{border-top:0;padding-top:4px}
.unit-row b{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.empty{text-align:center;padding:28px 18px}
.empty .ms{font-size:44px;color:var(--royal)}
.empty h3{margin:10px 0 6px}
.empty p{color:var(--ink-2)}
.skel{height:84px;border-radius:var(--r-lg);background:var(--surface);border:1.5px solid var(--line);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}

/* practice */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:6px}
.sec-h h2{font-size:22px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;min-width:0}
.mode .ms{font-size:24px;color:var(--royal)}
.mode b{font:700 16px/1.2 var(--f-body)}
.mode small{color:var(--ink-3);font-size:13px}
.mode[aria-pressed="true"]{border-color:var(--royal);background:var(--royal-soft)}
.mode[aria-pressed="true"] small{color:var(--ink-2)}
.mode.none{border-style:dashed}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:600;color:var(--ink-2);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--royal);box-shadow:0 1px 0 var(--line-2),0 0 0 1.5px var(--line)}
.chipbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chipbar::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font:600 14px var(--f-body);color:var(--ink-2);white-space:nowrap;min-height:40px}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.wlist{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.ghead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface-2);border-top:1.5px solid var(--line);position:relative;cursor:pointer}
.ghead:first-child{border-top:0}
.ghead .lbl{flex:1}
.wrow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.wrow input,.ghead input{position:absolute;opacity:0;width:1px;height:1px}
.cbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent;background:var(--surface);transition:background .12s}
.cbox .ms{font-size:18px;--sw:3}
input:checked + .cbox{background:var(--royal);border-color:var(--royal);color:var(--royal-ink)}
input:focus-visible + .cbox{outline:3px solid var(--royal);outline-offset:2px}
.wtxt{flex:1;min-width:0;display:flex;flex-direction:column}
.wtxt b{font-weight:600;overflow-wrap:anywhere}
.wtxt span{font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:6px;height:16px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.startbar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:10}
.startbar .btn{width:100%;font-size:18px;min-height:58px}
.opt-mark{font-size:12px;color:var(--ink-3);margin-left:4px}

/* vocab */
.search{position:relative}
.search input{width:100%;height:50px;border-radius:var(--r-md);border:1.5px solid var(--line-2);background:var(--surface);padding:0 16px 0 44px;font-size:16px}
.search .ms{position:absolute;left:14px;top:13px;color:var(--ink-3)}
.kasten{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end;height:140px;margin-top:6px}
.fach{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.fach .pile{width:100%;border-radius:8px 8px 4px 4px;min-height:14px;position:relative;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;background-image:repeating-linear-gradient(180deg,transparent 0 5px,rgba(0,0,0,.08) 5px 6px)}
.fach .pile b{font:800 15px var(--f-display);color:#1A1F3A;font-variant-numeric:tabular-nums}
.fach small{font:600 11px var(--f-body);color:var(--ink-3);white-space:nowrap}
.import-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:var(--r-lg);border:2px dashed var(--royal);background:var(--royal-soft);color:var(--ink)}
.import-card .ic{width:50px;height:50px;border-radius:16px;background:var(--royal);color:var(--royal-ink);display:grid;place-items:center;flex:none}
.import-card b{font:800 18px var(--f-display);display:block}
.import-card small{color:var(--ink-2);font-size:14px}
details.unit{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
details.unit summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer}
details.unit summary::-webkit-details-marker{display:none}
details.unit summary .ms{transition:transform .2s;color:var(--ink-3)}
details.unit[open] summary .ms.chev{transform:rotate(180deg)}
details.unit summary b{font:700 17px var(--f-display);display:block}
details.unit summary small{color:var(--ink-3);font-size:13px}
.vrow{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-start}
.vrow .grow b{font-weight:600}
.vrow .de{color:var(--ink-2);font-size:15px}
.vrow .ex{font-size:14px;color:var(--ink-3);font-style:italic;margin-top:2px}
.vrow .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.unit-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* awards */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px}
.tile .lbl{display:flex;align-items:center;gap:4px}
.tile .lbl .ms{font-size:16px}
.tile b{display:block;font:800 28px/1.1 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.tile small{color:var(--ink-3);font-size:13px}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bdg{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);min-width:0}
.bdg .medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--marker-soft);color:var(--marker-ink);box-shadow:inset 0 0 0 3px var(--hl)}
.bdg.locked .medal{background:var(--surface-2);color:var(--ink-3);box-shadow:none}
.bdg b{font-size:14px;font-weight:600;display:block;line-height:1.25}
.bdg small{font-size:12px;color:var(--ink-3);line-height:1.3;display:block}
.bdg > div{min-width:0}
.setting{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.switch{width:52px;height:32px;border-radius:999px;border:0;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.area{width:100%;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);padding:12px 14px;font:400 16px/1.5 var(--f-body);resize:vertical;min-height:120px}
.area[readonly]{font-size:13px;color:var(--ink-2)}
.field{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);padding:0 14px;font-size:16px}

/* quiz */
.quiz{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;padding-block:12px 40px}
.quiz.answered{padding-bottom:300px}
.qtop{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);padding:calc(6px + env(safe-area-inset-top,0px)) 0 6px;z-index:5}
.qbar{flex:1;height:16px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.qbar span{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.2,1);position:relative}
.qbar span::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.4)}
.combo{display:inline-flex;align-items:center;gap:2px;font:800 16px var(--f-display);color:var(--flame);min-width:44px;justify-content:flex-end}
.combo .ms{font-size:20px}
.qcard{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.qprompt{font:800 34px/1.12 var(--f-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.qprompt.long{font-size:25px}
.qprompt.sentence{font:500 24px/1.4 var(--f-body);letter-spacing:0}
.qsay{display:flex;align-items:center;gap:12px}
.blank{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--royal);color:var(--royal);font-weight:700;text-align:center;padding:0 .2em}
.blank.ok{color:var(--good-ink);border-color:var(--good)}
.hint{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:var(--r-md);font:500 18px/1.3 var(--f-body);min-height:62px;transition:transform .06s,background .15s,border-color .15s}
.opt:hover{border-color:var(--line-2)}
.opt:active{transform:translateY(2px);border-bottom-width:3px;margin-bottom:2px}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font:600 13px var(--f-body);color:var(--ink-3)}
.opt span.t{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.is-right{background:var(--good-soft);border-color:var(--good);color:var(--good-ink)}
.opt.is-right .key{border-color:var(--good);background:var(--good);color:var(--on-good)}
.opt.is-wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-ink);animation:shake .35s}
.opt.is-wrong .key{border-color:var(--bad);background:var(--bad);color:var(--on-good)}
.opt.is-dim{color:var(--ink-3)}
.opt[disabled]{cursor:default}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.typebox{display:flex;flex-direction:column;gap:10px}
.typebox input{height:60px;border-radius:var(--r-md);border:2px solid var(--line-2);border-bottom-width:4px;background:var(--surface);padding:0 18px;font:500 22px var(--f-body)}
.typebox input:focus{border-color:var(--royal);outline:none}
.typebox input.ok{border-color:var(--good);background:var(--good-soft)}
.typebox input.no{border-color:var(--bad);background:var(--bad-soft)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:3px solid;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet.ok{background:var(--good-soft);border-color:var(--good);color:var(--good-ink)}
.sheet.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-ink)}
.sheet-in{max-width:560px;margin:0 auto;padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head .ms{font-size:30px}
.sheet-head strong{font:800 24px var(--f-display);flex:1}
.gain{font:800 16px var(--f-display);background:var(--hl);color:var(--marker-ink);padding:4px 10px;border-radius:999px}
.sheet .wcard{background:var(--surface);color:var(--ink);border-radius:var(--r-md);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.sheet .wcard .grow b{font-weight:600}
.sheet .wcard .de{font-size:14px;color:var(--ink-2)}
.sheet .wcard .ex{font-size:14px;color:var(--ink-3);font-style:italic;margin-top:2px}
@keyframes up{from{transform:translateY(100%)}}

/* result */
.result{display:flex;flex-direction:column;gap:16px;padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.result .hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.result .hero .big{width:96px;height:96px;border-radius:30px;display:grid;place-items:center;background:var(--marker-soft);color:var(--marker-ink)}
.result .hero .big .ms{font-size:56px}
.result h1{font-size:44px}
.xpline{font:800 40px var(--f-display);font-variant-numeric:tabular-nums}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles3 .tile{padding:12px;text-align:center}
.tiles3 .tile b{font-size:24px}
.streakbox{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-lg);background:var(--flame-soft);color:var(--ink)}
.streakbox .ms{font-size:44px;color:var(--flame)}
.streakbox b{font:800 22px var(--f-display);display:block}
.newbadge{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.mist{display:flex;flex-direction:column}
.mist div{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.mist div:first-child{border-top:0}

/* import */
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;border:2.5px dashed var(--royal);border-radius:var(--r-lg);background:var(--royal-soft);text-align:center;cursor:pointer}
.drop .ms{font-size:40px;color:var(--royal)}
.drop b{font:800 19px var(--f-display)}
.drop small{color:var(--ink-2)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--surface-2);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(13,17,40,.7);color:#fff;display:grid;place-items:center}
.thumb button .ms{font-size:18px}
.spin{width:56px;height:56px;border-radius:50%;border:6px solid var(--royal-soft);border-top-color:var(--royal);animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.irow{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-start;position:relative}
.irow.off .grow{opacity:.55}
.irow .edit{display:grid;gap:8px;margin-top:8px}
.irow .edit input{height:42px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);padding:0 12px;font-size:16px;width:100%}

/* overlays */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,13,32,.55);display:grid;place-items:center;padding:16px}
.dialog{width:100%;max-width:420px;background:var(--surface);border-radius:26px;padding:24px 20px 18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.dialog h2{font-size:28px}
.dialog .logo{width:56px;height:56px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:70;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:500;font-size:15px;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;display:flex;gap:8px;align-items:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:600px){.qprompt{font-size:40px}.qprompt.long{font-size:28px}}
</style>
</head>

function buildRound(ids, mode, n, extras) {

/* ---------- typed answers ---------- */
function normAns(s) {
  return String(s).toLowerCase().replace(/[’`´]/g, "'").replace(/…|\.\.\./g, ' ')
    .replace(/\b(sb|sth|somebody|something|someone)\b/g, ' ')
    .replace(/\b(your|my|his|her|their|our)\b/g, "one's")
    .replace(/[.,!?;:"“”„]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^to /, '').trim();
}
function variants(t) {
  const out = new Set();
  const base = String(t).replace(/\(=\s*([^)]*)\)/g, (m, a) => { out.add(normAns(a)); return ' ' });
  for (const alt of base.split(/\s\/\s/)) { out.add(normAns(alt.replace(/\([^)]*\)/g, ' '))); out.add(normAns(alt.replace(/[()]/g, ' '))) }
  out.delete(''); return Array.from(out);
}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur }
  return prev[n];
}
function checkTyped(input, target) {
  const v = normAns(input), vs = variants(target);
  if (vs.indexOf(v) >= 0) return { ok: true, almost: false };
  if (vs.some(x => x.length >= 4 && lev(x, v) <= 1)) return { ok: true, almost: true };
  return { ok: false, almost: false };
}

/* ---------- quiz flow ---------- */
const PRAISE = ['Great!', 'Brilliant!', 'Well done!', 'Spot on!', 'Excellent!', 'Nice one!', 'Super!', 'Klasse!', 'Stark!', 'Perfekt!'];
const OOPS = ['Nicht ganz.', 'Knapp daneben.', 'Fast!', 'Das war’s nicht.'];
function startRound(ids, mode, n, opts = {}) {
  const list = buildRound(ids, mode, n, opts.extras !== false);
  if (!list.length) { toast('Für diese Abfrage passen keine Wörter aus deiner Auswahl.', 'info'); return }
  S.quiz = { mode, list, i: 0, answered: false, chosen: null, combo: 0, bestCombo: 0, right: 0, wrong: 0, xp: 0, promoted: 0,
    mistakes: new Map(), requeued: new Set(), typed: '', typeErr: '', goalHit: false, extraCount: list.filter(q => q.extra).length };
  S.view = 'quiz'; S.confirm = null;
  render(); window.scrollTo(0, 0);
}
function answerMC(idx) {
  const Q = S.quiz; if (!Q || Q.answered) return;
  const q = Q.list[Q.i]; Q.chosen = idx;
  settle(q.options[idx] === q.answer, false);
}
function answerTyped() {
  const Q = S.quiz; if (!Q || Q.answered) return;
  const inp = document.getElementById('typeIn'); const val = (inp && inp.value || '').trim();
  if (!val) { Q.typeErr = 'Schreib zuerst eine Antwort.'; render(); focusType(); return }

}

  if (grade(q.wid, ok)) Q.promoted++;
  let gain = 0;

    Q.combo++; Q.bestCombo = Math.max(Q.bestCombo, Q.combo); Q.right++;
    gain = q.type === 'type' ? 3 : 2;

    if (!Q.requeued.has(q.wid) && w) { Q.requeued.add(q.wid); Q.list.splice(Math.min(Q.list.length, Q.i + 3), 0, makeQ(w, q.type, q.extra)); Q.again = true }
    SFX.bad();

  Q.gain = gain; Q.xp += gain; S.prog.xp += gain;
  if (addDayXP(gain)) Q.goalHit = true;
  S.prog.bestCombo = Math.max(S.prog.bestCombo, Q.bestCombo);
  persist(false);
  if (S.prog.speak) say(q.say);

  const nb = document.getElementById('nextBtn'); if (nb) nb.focus({ preventScroll: true });
}
function nextQ() {
  const Q = S.quiz; if (!Q) return;

function viewQuiz() {
  const Q = S.quiz, q = Q.list[Q.i];
  const prog = (Q.i + (Q.answered ? 1 : 0)) / Q.list.length;
  const w = S.byId.get(q.wid) || {};
  let body = '';
  const extraTag = q.extra ? `<span class="pill pill-marker">${icon('autorenew')}Wiederholung · ${esc(q.unitTitle)}</span>` : '';
  if (q.type === 'gap') {
    body = `<div class="qprompt sentence">${esc(q.before)}<span class="blank ${Q.answered ? 'ok' : ''}">${Q.answered ? esc(q.answer) : '&nbsp;'}</span>${esc(q.after)}</div>
      <span class="hint">${icon('translate')}${esc(q.hint)}</span>`;
  } else {
    const long = String(q.prompt).length > 26 ? 'long' : '';
    body = `<div class="qsay"><div class="qprompt ${long} grow">${esc(q.prompt)}</div>${q.showSay ? `<button class="iconbtn" data-act="say" data-t="${esc(q.prompt)}" aria-label="Vorlesen">${icon('volume_up')}</button>` : ''}</div>
      ${q.showSay && w.ipa ? `<span class="ipa">${esc(w.ipa)}</span>` : ''}${q.hint ? `<span class="hint">${icon('translate')}${esc(q.hint)}</span>` : ''}`;
  }
  let answers;
  if (q.type === 'type') {
    const st = Q.answered ? (Q.lastOk ? 'ok' : 'no') : '';
    answers = `<div class="typebox"><input id="typeIn" class="${st}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Englisch eintippen" value="${esc(Q.typed)}" ${Q.answered ? 'readonly' : ''} aria-label="Antwort auf Englisch" data-in="typing">
      ${Q.typeErr ? `<div class="err" role="alert">${esc(Q.typeErr)}</div>` : ''}
      ${Q.answered ? '' : `<button class="btn btn-primary wide" data-act="type-check">Prüfen</button><button class="link" data-act="type-skip">Weiß ich nicht</button>`}</div>`;
  } else {
    answers = `<div class="opts" role="group" aria-label="Antworten">${q.options.map((o, i) => {
      let cls = '';
      if (Q.answered) { if (o === q.answer) cls = 'is-right'; else if (i === Q.chosen) cls = 'is-wrong'; else cls = 'is-dim' }
      return `<button class="opt ${cls}" data-act="ans" data-i="${i}" ${Q.answered ? 'disabled' : ''}><span class="key">${i + 1}</span><span class="t">${esc(o)}</span></button>` }).join('')}</div>`;
  }
  let sheet = '';
  if (Q.answered) {
    const ok = Q.lastOk;
    const exHtml = w.ex ? `<div class="ex">${esc(w.ex)}</div>` : '';
    const note = w.pos === 'phrase' && w.note ? `<div class="ex">${esc(w.note)}</div>` : '';
    const sayT = q.type === 'past' ? w.past : w.en;
    const wcard = `<div class="wcard"><div class="grow"><b>${esc(w.en)}</b>${q.type === 'past' ? ` → <b>${esc(w.past)}</b>` : ''}${w.ipa ? ` <span class="ipa">${esc(w.ipa)}</span>` : ''}<div class="de">${esc(w.de)}</div>${exHtml}${note}</div><button class="iconbtn sm" data-act="say" data-t="${esc(sayT)}" aria-label="Vorlesen">${icon('volume_up')}</button></div>`;
    sheet = `<div class="sheet ${ok ? 'ok' : 'no'}" role="status" aria-live="polite"><div class="sheet-in">
      <div class="sheet-head">${icon(ok ? 'check_circle' : 'cancel', 'fill')}<strong>${esc(Q.praise)}</strong>${Q.gain ? `<span class="gain">+${Q.gain} XP</span>` : ''}</div>
      ${ok && Q.almost ? `<div>Ein kleiner Tippfehler. Richtig geschrieben: <b>${esc(q.answer)}</b></div>` : ''}
      ${!ok ? `<div>Richtig ist: <b>${esc(q.answer)}</b>${Q.again ? ' · kommt gleich nochmal' : ''}</div>` : ''}
      ${wcard}
      <button class="btn ${ok ? 'btn-good' : 'btn-bad'} wide" data-act="next" id="nextBtn">Weiter ${icon('arrow_forward')}</button>
    </div></div>`;
  }
  const comboHtml = Q.combo >= 2 ? `<span class="combo" title="Richtig in Folge">${icon('bolt', 'fill')}${Q.combo}</span>` : '<span class="combo"></span>';
  const confirm = S.confirm === 'quit' ? `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="qT"><h2 id="qT">Runde beenden?</h2><p class="muted">Deine Antworten und XP bis hierhin bleiben gespeichert. Für die Serie zählt nur eine fertige Runde.</p>
    <button class="btn btn-primary wide" data-act="quit-no">Weiter üben</button><button class="btn btn-line wide" data-act="quit-yes">Beenden</button></div></div>` : '';
  return `<div class="quiz ${Q.answered ? 'answered' : ''}">
    <div class="qtop"><button class="iconbtn plain" data-act="quit" aria-label="Runde beenden">${icon('close')}</button>
      <div class="qbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(prog * 100)}" aria-label="Fortschritt"><span style="width:${Math.max(3, prog * 100).toFixed(1)}%"></span></div>${comboHtml}</div>
    <div class="qcard">${extraTag}<span class="lbl">${esc(q.label)}</span>${body}</div>
    ${answers}

Each vocabulary row has three columns: (1) the English headword, usually followed by its IPA pronunciation in slashes and sometimes by "simple past: …"; (2) the German meaning; (3) optionally an English example sentence, an opposite written as "X ↔ Y", or a short note. Small boxed labels such as "A10" or "B4" mark textbook sections; a label applies to its row and all following rows until the next label.

Reply with ONE JSON object and nothing else, shaped like:
{"title":"Theme 2: …","pages":"S. 227–228","words":[{"en":"to choose","de":"(aus)wählen","ipa":"/tʃuːz/","pos":"verb","past":"chose","pp":"chosen","ex":"He is choosing a book to read.","gap":"choosing","opp":"","sec":"A10","note":""}]}

- title: the theme or unit heading printed on the page, or "". pages: the page numbers as "S. x–y", or "".
- en: the English headword exactly as printed, including "to " for verbs and brackets like "(sth)", without the IPA.
- de: the German meaning exactly as printed (keep commas and "hier:" notes).
- ipa: the IPA as printed including slashes, or "".
- pos: one of verb, noun, adj, adv, phrase, other.

- pp: the past participle for irregular verbs, else "".
- ex: the English example sentence from column 3, or "".
- gap: the exact part of ex that is the headword (usually bold, possibly inflected, e.g. "chose"); "" if there is none.
- opp: if column 3 shows "X ↔ Y" for this word, the other side; else "".
- sec: the section label that applies, or "".
- note: other short info from column 3 that is not an example sentence (e.g. "to call = to phone"), else "".
If a "Say it in English" box is visible, add one entry per row with pos "phrase", de = the German situation on the left, en = the first English phrase on the right, note = "Auch: " plus the other English variants, sec "Say it".

const POS = ['verb', 'noun', 'adj', 'adv', 'phrase', 'other'];
function normalizeImport(data) {

  const seen = new Set(), out = [];

    if (w.gap && w.ex.indexOf(w.gap) < 0) w.gap = '';
    if (!w.en || !w.de || w.en.length > 90 || w.de.length > 140) continue;
    const key = nk(w.en) + '|' + nk(w.de); if (seen.has(key)) continue; seen.add(key);

  const arr = Array.isArray(data) ? data : (data && Array.isArray(data.words) ? data.words : []);
  const title = (data && typeof data.title === 'string' && data.title.trim()) || L.title || 'Lektion';
  const pages = (data && typeof data.pages === 'string' && data.pages.trim()) || L.pages || '';
  const words = [], ids = new Set();
  arr.forEach((o, i) => {
    if (!o || typeof o.en !== 'string' || typeof o.de !== 'string' || !o.en.trim() || !o.de.trim()) return;
    let id = typeof o.id === 'string' && o.id.trim() ? o.id.trim() : L.id + '-' + String(i + 1).padStart(3, '0');
    if (ids.has(id)) id = L.id + '-' + String(i + 1).padStart(3, '0') + 'x';
    ids.add(id);
    const w = { id, en: o.en.trim(), de: o.de.trim(), pos: POS.indexOf(o.pos) >= 0 ? o.pos : 'other' };
    for (const k of ['ipa', 'past', 'pp', 'ex', 'gap', 'opp', 'sec', 'note']) if (typeof o[k] === 'string' && o[k].trim()) w[k] = o[k].trim();
    if (o.opt) w.opt = true;
    if (w.pos !== 'verb' && w.past) w.pos = 'verb';
    if (w.gap && (!w.ex || w.ex.indexOf(w.gap) < 0)) delete w.gap;
    words.push(w);
  });
  return { id: L.id, title, pages, rev: +L.rev || 1, source: 'server', createdAt: todayKey(), words };
}
let syncing = false, lastSync = 0;
async function syncLists() {
  if (syncing || !/^https?:$/.test(location.protocol)) return;
  syncing = true; lastSync = Date.now();
  try {
    const r = await fetch('lists/index.json', { cache: 'no-cache' });
    if (!r.ok) return;
    const idx = await r.json();
    const lists = Array.isArray(idx) ? idx : (idx && Array.isArray(idx.lists) ? idx.lists : []);
    const removed = new Set(S.prog.removedLists || []);
    const added = [], updated = [];
    for (const L of lists) {
      if (!L || typeof L.id !== 'string' || typeof L.file !== 'string' || removed.has(L.id)) continue;
      const have = S.units.find(u => u.id === L.id);
      if (have && (+have.rev || 1) >= (+L.rev || 1)) continue;
      let data;
      try { const rr = await fetch('lists/' + encodeURIComponent(L.file), { cache: 'no-cache' }); if (!rr.ok) continue; data = await rr.json() } catch (e) { continue }
      const unit = listToUnit(L, data);
      if (!unit.words.length) continue;
      if (have) { unit.order = have.order; Object.assign(have, unit); updated.push(unit) }
      else { unit.order = Math.max(0, ...S.units.map(u => u.order || 0)) + 1; S.units.push(unit); added.push(unit) }
    }
    if (!added.length && !updated.length) return;
    saveUnits();
    if (added.length) { S.prog.sel = added[added.length - 1].words.map(w => w.id); persist() }
    if (S.view !== 'quiz' && S.view !== 'import') render();
    if (added.length) toast(added.length === 1 ? 'Neue Lektion: ' + added[0].title : added.length + ' neue Lektionen geladen', 'library_add');
    else toast(updated.map(u => u.title).join(', ') + ' wurde aktualisiert.', 'autorenew');
  } catch (e) {
  } finally { syncing = false }
}

/* ---------- boot ---------- */
S.storageOk = store.set('wordbox.check', todayKey());
if (!store.get(LS_UNITS)) store.set(LS_UNITS, S.units);
index();
render();
updateBadge();
if (S.prog.onboarded) targetReminder();
syncLists();
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastSync > 10 * 60 * 1000) syncLists() });
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}) });
}
})();
</script>
