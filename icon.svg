<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A57E8"/>
      <stop offset="1" stop-color="#1C2F9C"/>
    </linearGradient>
    <!-- Ein Bissen fehlt oben rechts, durch den ganzen Kartenstapel: vier überlappende Kreise -->
    <mask id="bite">
      <rect x="-200" y="-200" width="912" height="912" fill="#fff"/>
      <circle cx="402" cy="178" r="52"/>
      <circle cx="356" cy="150" r="32"/>
      <circle cx="422" cy="232" r="32"/>
      <circle cx="372" cy="212" r="26"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <g mask="url(#bite)">
    <!-- gelbe Karte dahinter (Textmarker) -->
    <rect x="134" y="146" width="256" height="196" rx="30" fill="#FFD43B" transform="rotate(-10 262 244)"/>
    <!-- weiße Vokabelkarte -->
    <g transform="rotate(3 256 256)">
      <rect x="150" y="166" width="256" height="196" rx="30" fill="#FFFFFF"/>
      <rect x="184" y="222" width="150" height="38" rx="9" fill="#FFF2C2"/>
      <path d="M194 241h128" stroke="#2E47CF" stroke-width="18" stroke-linecap="round"/>
      <path d="M194 297h92" stroke="#2E47CF" stroke-width="18" stroke-linecap="round" opacity=".5"/>
    </g>
  </g>
  <!-- Krümel -->
  <circle cx="446" cy="132" r="9" fill="#FFFFFF"/>
  <circle cx="470" cy="176" r="6" fill="#FFD43B"/>
  <circle cx="428" cy="98" r="5" fill="#FFD43B"/>
</svg>
